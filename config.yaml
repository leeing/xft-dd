schema_version: "1.0"

dimension_concurrency: 8
query_concurrency_per_dimension: 5
search_timeout_seconds: 30
max_results_per_query: 10
runs_dir: "runs"

# AI 角色提示词 — 可按行业/场景定制（不改代码）
summarize_system_prompt: "你是中国制造业企业尽调专家，擅长从网络搜索结果中提取和分析企业信息，对信息的可信度和来源有严格的判断标准。你的输出必须是合法 JSON，不包含任何其他内容。"
merge_system_prompt: "你是一个中国制造业行业顶级专家，对制造业行业有深刻理解，善于综合多维度信息给出精准的企业尽调结论。"

# Playwright 全文抓取参数（仅在维度设置 fetch_enabled: true 时生效）
playwright_fetch_timeout: 25
playwright_fetch_concurrency: 2

# 可抓取域名白名单：domain片段 → 含 {target} 占位符的 URL 模板
# 留空则 Playwright 抓取全面禁用（即使 fetch_enabled: true）。
# 示例：
#   fetchable_domains:
#     "example.com": "https://example.com/search?q={target}"
#     "anothersite.cn": "https://anothersite.cn/company/{target}"
fetchable_domains: {}

report_options:
  include_sources: true
  include_checklist: true
  max_sources_per_dimension: 5

batch:
  company_concurrency: 1
  continue_on_company_error: true
  skip_existing: true
  batch_runs_dir: "batch_runs"

merge_prompt: |
  你是中国制造业顶级专家。以下是对"{target}"各维度的尽调摘要：

  {summaries}

  请综合以上信息，输出一份精简的企业尽调报告，报告必须包含以下8项（无数据时明确写「未找到」，不得省略）：

  1. **统一社会信用代码**：直接列出代码值
  2. **所属行业与细分行业**：国民经济分类 + 细分赛道
  3. **员工规模**：总人数（社保参保数优先）+ 研发人员数量或占比（有则列出，无则注明未找到）
  4. **企业背景**：民营/国有/外资/合资 + 是否上市；如有股东/实控人信息一并列出
  5. **科技属性资质**：高新技术企业证书编号、双软认证、专精特新、小巨人资质（每项有无均需说明）
  6. **知识产权**：专利数量（发明/实用新型/外观分类）、软件著作权数量、商标数量
  7. **产品与定位**：核心产品线、面向C端还是B端、主要客户类型
  8. **上市情况**：境内外是否上市或拟上市（每个市场均需明确说明）

  格式要求：
  - 按以上8项分节编号
  - 每项后标注可信度（高/中/低/待核实）
  - 在报告末尾生成"人工核验清单"，列出所有「待核实」或「未找到」项及建议核验渠道
  - 不得编造未出现在维度摘要中的事实

dimensions:
  - id: basic_info
    name: 工商基本信息
    order: 10
    enabled: true
    required: true
    fetch_enabled: true
    minimax_queries:
      - '"{target}" 统一社会信用代码'
      - '"{target}" 法定代表人'
      - '"{target}" 注册资本'
      - '"{target}" 成立日期'
      - '"{target}" 注册地址'
      - '"{target}" 经营范围'
      - '"{target}" 参保人数'
      - '"{target}" 经营状态'
    metaso_queries:
      - '{target}的统一社会信用代码是什么？'
      - '{target}的法定代表人是谁？注册资本是多少？成立日期是哪一天？'
      - '{target}的经营状态、注册地址和经营范围是什么？'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的工商基本信息。

      【数据提取规则】
      搜索结果中"{target}"可能以多种形式出现：
      - 作为查询主体（企查查/天眼查/启信宝的公司主页）→ 权威来源
      - 作为关联公司/相关企业被提及 → 次要来源，但字段值仍可使用
      - 在招聘信息、新闻、行业报告中被提及 → 辅助来源
      无论哪种形式出现，只要该字段数据明确指向"{target}"，都应提取并标注来源类型。

      【信源权重与冲突处理】
      - 政府文件（gov.cn域名、政府补贴名单、工商公示）> 企查查/天眼查 > 招聘平台/新闻
      - 当多个来源数据冲突时，按上述权重选取最可信值，并说明冲突情况
      - 统一社会信用代码以18位且来源于政府/工商文件的为准；若检测机构代码与工商代码不一致，取工商代码
      - 职业卫生检测报告中的统一社会信用代码是检测机构自身的代码，不是被检测企业的代码

      【可信度判断标准】
      - 高：≥2个独立来源数据一致（含官方数据库或政府来源）
      - 中：1个来源有明确数据，或多个来源有相同数据（均为商业信息网站）
      - 低：仅从侧面/关联信息推断，或数据较旧（>3年）
      - 待核实：各来源数据互相冲突且无法判断权重，或完全没有相关信息

      【提取字段】（有数据就填，无任何线索才写「待核实」）
      - 统一社会信用代码（18位字母数字组合）
      - 法定代表人姓名
      - 注册资本（金额+币种，如"1000万元人民币"）
      - 成立日期（精确到年月日或年份）
      - 经营状态（存续/注销/吊销等）
      - 企业类型（有限责任公司/股份公司等）
      - 注册地址（尽可能完整）
      - 经营范围（摘要，50字内）
      - 参保人数/员工人数（社保参保人数优先）

      搜索结果：
      {results}

  - id: industry
    name: 行业与细分
    order: 20
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 所属行业'
      - '"{target}" 经营范围'
      - '"{target}" 主营业务'
      - '"{target}" 主营产品'
    metaso_queries:
      - '{target}属于什么行业？国民经济行业分类是什么？主营业务和产品是什么？'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的行业与细分信息。
      重点提取：所属行业（国民经济行业分类）、细分赛道、主营业务描述、经营范围摘要。
      企查查/天眼查的「行业」字段最权威；BOSS直聘的行业标签作为辅助；制造业目录(curtao)提供产品细分。

      搜索结果：
      {results}

  - id: scale
    name: 员工规模
    order: 30
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 参保人数'
      - '"{target}" 员工人数'
      - '"{target}" 员工规模'
      - '"{target}" 研发人员'
      - '"{target}" 研发团队'
      - '"{target}" 研发费用 研发投入'
      - '"{target}" 工程师 技术人员 招聘'
    metaso_queries:
      - '{target}有多少员工？社保参保人数是多少？研发人员数量或占比是多少？'
      - '{target}的研发投入占营收比例是多少？研发工程师有多少人？'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的员工规模信息，重点包括：
      1. 总员工人数（社保参保人数最精确，招聘平台规模区间作参考）
      2. 研发人员数量或占比（如有）
      信源说明：企查查「参保」数据为社保缴纳人数（最精确）；BOSS直聘/猎聘提供规模区间（如100-499人）。
      如多个来源数据不一致，全部列出并注明来源。
      若未找到研发人员相关信息，明确写「未找到研发人员数据」，不要省略该项。

      搜索结果：
      {results}

  - id: background
    name: 企业背景
    order: 40
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 股东'
      - '"{target}" 实际控制人'
      - '"{target}" 持股比例 股权结构'
      - '"{target}" site:qcc.com 股东'
      - '"{target}" site:tianyancha.com 股东'
      - '"{target}" 行政处罚'
      - '"{target}" 失信'
      - '"{target}" 被执行人'
    metaso_queries:
      - '{target}的企业性质是民营还是国有？实际控制人和主要股东是谁？持股比例是多少？'
      - '{target}是否有行政处罚、失信或被执行人记录？'
    summary_prompt: |
      请从以下搜索结果中分析"{target}"的企业背景。
      重点提取：企业性质（民营/国有/外资/合资）、实际控制人、主要股东及持股比例、是否有行政处罚/失信记录。

      【提取规则】
      - 即使"{target}"在结果中仅被侧面提及，也应从中提取企业性质等可推断信息
      - 注册资本规模+成立年份等信息可辅助判断是否为民营小微企业
      - 未见行政处罚/失信记录时，明确写"未发现"而非"待核实"
      - 企查查与天眼查股东数据一致则标「高」；仅一方有数据标「中」；无股权结构但能推断企业性质标「低」

      【可信度判断】
      - 高：企业性质 + 实控人/股权结构来自≥2个权威来源且一致
      - 中：企业性质可从多个来源合理推断，或有单一来源的股权数据
      - 低：仅能推断企业性质，无股权/实控人数据
      - 待核实：连企业性质也无法判断

      搜索结果：
      {results}

  - id: tech_cert
    name: 科技属性资质
    order: 50
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 高新技术企业'
      - '"{target}" 专精特新'
      - '"{target}" 小巨人'
      - '"{target}" 隐形冠军'
      - '"{target}" 资质认证'
    metaso_queries:
      - '{target}是否是国家高新技术企业？证书编号是什么？认定年份是哪年？'
      - '{target}是否获得专精特新中小企业或专精特新小巨人认定？是否有双软认证或ISO认证？'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的科技属性资质。
      重点提取：高新技术企业（证书编号+认定年份）、专精特新/小巨人、双软认证、ISO认证、其他行业资质。
      有证书编号或政府名单来源标「高」；仅商业库收录无编号标「中」。

      搜索结果：
      {results}

  - id: ip
    name: 知识产权
    order: 60
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 专利'
      - '"{target}" 商标'
      - '"{target}" 软件著作权'
      - '"{target}" 发明专利'
      - '"{target}" 实用新型'
      - '"{target}" site:cnipa.gov.cn'
      - '"{target}" 发明专利 实用新型 外观设计 分类 数量'
      - '"{target}" 软件著作权 登记号'
    metaso_queries:
      - '{target}拥有多少专利？其中发明专利、实用新型专利、外观设计专利各有多少？'
      - '{target}拥有多少软件著作权？注册了哪些商标？'
      - '{target}在国家知识产权局登记的专利明细是什么？发明专利有哪些？'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的知识产权信息。
      重点提取：专利总数（发明/实用新型/外观分类）、商标数量及主要商标名、软件著作权数量。

      【信源权重】
      - 国家知识产权局(cnipa.gov.cn)/Google Patents：最权威，列出具体专利号
      - 企查查/天眼查/启信宝：次权威，给出汇总数字
      - 招聘平台/新闻：仅作辅助参考
      - 当汇总数字与明细不一致时，采信权威信源的汇总数字，并注明"明细仅列举部分"

      【可信度判断】
      - 高：有权威平台汇总数字且≥2个平台数据一致
      - 中：有具体专利号/商标号/著作权登记号等明细数据（即使无汇总数字）
      - 低：仅有模糊描述，无具体编号
      - 待核实：完全无数据

      搜索结果：
      {results}

  - id: product
    name: 产品与定位
    order: 70
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 主营产品'
      - '"{target}" 核心产品'
      - '"{target}" 客户'
      - '"{target}" 供应商'
      - '{target} site:1688.com'
    metaso_queries:
      - '{target}的核心产品是什么？主要客户类型是哪些？面向C端还是B端市场？'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的产品与市场定位信息。
      制造业采购平台(curtao.com, 1688.com)的产品目录最具参考价值；官网/展会信息作为补充。
      重点提取：核心产品线、技术特点/差异化、主要客户类型或合作品牌、市场定位（高中低端/To B/To C）。
      即使数据来自侧面提及或展会记录，也应提取产品关键词并说明数据来源。

      搜索结果：
      {results}

  - id: listing
    name: 上市情况
    order: 80
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 上市'
      - '"{target}" 股票代码'
      - '"{target}" IPO'
      - '"{target}" 港股'
      - '"{target}" 纳斯达克'
    metaso_queries:
      - '{target}是否在A股、港股或美股上市？股票代码是什么？是否有IPO或拟上市计划？'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的上市情况。
      重点提取：
      1. 境内上市（A股沪深主板/创业板/科创板/北交所）：股票代码、上市板块
      2. 境外上市（港股、纳斯达克、纽交所等）：上市地点、代码
      3. 拟上市/辅导备案记录（境内外均需说明）

      【可信度判断标准】
      - 高：多个结果均未发现上市信息，且该公司仅作为第三方（如供应商）出现在他人IPO文件中
      - 中：有间接上市迹象但无直接证据
      - 待核实：结果中有明确的IPO/上市信息，需要人工核实

      注意：若"{target}"在他人的招股书中作为供应商/关联方出现，这不是该公司自身上市，应标注清楚并标「高」（未上市）。

      搜索结果：
      {results}
