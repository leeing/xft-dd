schema_version: "1.0"

dimension_concurrency: 8
query_concurrency_per_dimension: 5
search_timeout_seconds: 30
max_results_per_query: 10
runs_dir: "runs"

# AI 角色提示词 — 可按行业/场景定制（不改代码）
summarize_system_prompt: "你是中国制造业企业尽调专家，擅长从网络搜索结果中提取和分析企业信息，对信息的可信度和来源有严格的判断标准。你的输出必须是合法 JSON，不包含任何其他内容。"
merge_system_prompt: "你是一个中国制造业行业顶级专家，对制造业行业有深刻理解，善于综合多维度信息给出精准的企业尽调结论。"

# crawl4ai 全文抓取参数（仅在维度设置 fetch_enabled: true 时生效）
crawl_fetch_timeout: 25
crawl_fetch_concurrency: 2

# 抓取域名黑名单：URL 中包含任意一项则跳过 crawl4ai 全文抓取
# 留空则 fetch_enabled: true 时抓取全部非 metaso 页面。
fetch_blocked_domains:
  - "qixin.com"
  - "qcc.com"
  - "gsxt.gov.cn"
  - "aiqicha.baidu.com"
  - "innocom.gov.cn"
  - "pss-system.cponline.cnipa.gov.cn"

report_options:
  include_sources: true
  include_checklist: true
  max_sources_per_dimension: 5

batch:
  company_concurrency: 1
  continue_on_company_error: true
  skip_existing: true
  batch_runs_dir: "batch_runs"

merge_prompt: |
  你是中国制造业顶级专家。以下是对"{target}"各维度的尽调摘要。每个维度下可能包含「结构化字段提取数据」表格（已多源交叉验证），该表格的数据优先级高于摘要文本——表格中有值的字段必须直接采用，不得因摘要文本未提及而标为"未找到"。

  {summaries}

  请综合以上信息（摘要+提取数据），输出一份精简的企业尽调报告。

  对于摘要中标注 **status: 未执行** 的维度，对应章节直接写「**未执行** — 本维度未在本次运行中检索」，不得改写为「未找到」或编造任何内容。
  对于标注 **status: 执行失败** 的维度，写「**执行失败** — 搜索或抓取过程异常」，无需列出字段详情。

  报告按以下结构输出，有数据的维度列出字段详情，未执行或失败的维度简要说明状态即可：

  1. **工商基本信息**：从维度摘要中提取所有可用字段，按以下子类逐一输出（有数据列数据，无数据写"未找到"，严禁省略任何一项）：

     **1.1 主体登记信息**
     - 企业名称（工商全称）
     - 统一社会信用代码（18位）
     - 法定代表人
     - 注册资本（金额+币种）
     - 实缴资本（金额+币种）
     - 成立日期（精确到年月日）
     - 经营状态（存续/在业/注销/吊销等）
     - 企业类型（有限责任公司/股份有限公司/合伙企业等）
     - 营业期限（起止日期或"长期"）
     - 登记机关
     - 核准日期
     - 工商注册号
     - 纳税人识别号
     - 组织机构代码

     **1.2 联系与地址**
     - 注册地址（完整地址）
     - 经营范围（摘要）
     - 所属行业（国民经济行业分类）
     - 曾用名
     - 英文名
     - 官网URL
     - 联系电话（公开披露的）
     - 电子邮箱（公开披露的）

     **1.3 人员与规模**
     - 社保参保人数
     - 人员规模区间（如50-99人、100-499人）
     - 研发人员数量或占比

     **1.4 股权与治理**
     - 股东/发起人信息（名称+持股比例+认缴出资额）
     - 主要人员（董事、监事、高管姓名及职务）
     - 分支机构（名称+状态+地区）
     - 对外投资（企业名称+持股比例+投资金额）

     **1.5 历史与风险**
     - 变更记录（变更事项+变更前后内容+变更日期）
     - 经营异常（列入原因+日期+移出日期）
     - 行政处罚（处罚机关+内容+日期）
     - 严重违法失信（有/无+详情）

     **1.6 数据来源**
     - 每条关键信息的来源名称
     - 来源URL（如有）
  2. **所属行业与细分行业**：国民经济分类 + 细分赛道
  3. **员工规模**：总人数（社保参保数优先）+ 研发人员数量或占比（有则列出，无则注明未找到）
  4. **企业背景**：民营/国有/外资/合资 + 是否上市；如有股东/实控人信息一并列出
  5. **科技属性资质**：高新技术企业证书编号、双软认证、专精特新、小巨人资质（每项有无均需说明）
  6. **知识产权**：专利数量（发明/实用新型/外观分类）、软件著作权数量、商标数量
  7. **产品与定位**：核心产品线、面向C端还是B端、主要客户类型
  8. **上市情况**：境内外是否上市或拟上市（每个市场均需明确说明）

  格式要求：
  - 按以上8项分节编号
  - 每项后标注可信度（高/中/低/待核实）
  - 在报告末尾生成"人工核验清单"，列出所有「待核实」或「未找到」项及建议核验渠道
  - 不得编造未出现在维度摘要中的事实

dimensions:
  - id: basic_info
    name: 工商基本信息
    order: 10
    enabled: true
    required: true
    fetch_enabled: true
    minimax_queries:
      - '"{target}"'
    metaso_queries:
      - "{target} 工商注册信息 统一社会信用代码 法定代表人 注册资本"
      - "{target} 成立日期 经营状态 企业类型 注册地址 经营范围"
    metaso_search_size: 1
    extract_fields:
      - field_name: 企业名称
        description: "工商登记注册的企业全称"

      - field_name: 统一社会信用代码
        description: "18位字母数字组合，企业唯一识别码"

      - field_name: 经营状态
        description: "存续/在业/开业/注销/吊销/迁出等"

      - field_name: 法定代表人
        description: "法定代表人姓名；分公司、个体户、合伙企业可能为负责人/经营者/执行事务合伙人"

      - field_name: 注册资本
        description: "金额+币种，如1000万元人民币"

      - field_name: 实缴资本
        description: "已实际缴纳的资本金额+币种，如500万元人民币；缺失则标记未找到"

      - field_name: 成立日期
        description: "企业成立日期，精确到年月日，如2008-12-12"

      - field_name: 企业类型
        description: "有限责任公司/股份有限公司/个人独资企业/合伙企业/个体工商户/分公司等"

      - field_name: 营业期限
        description: "营业期限起止日期或长期，如2008-12-12至长期"

      - field_name: 登记机关
        description: "负责登记的市场监督管理局或行政审批机关"

      - field_name: 核准日期
        description: "最近一次工商登记核准日期，精确到年月日"

      - field_name: 工商注册号
        description: "工商登记注册号；部分企业可能与统一社会信用代码不同或已不单独展示"

      - field_name: 纳税人识别号
        description: "税务识别号码，通常与统一社会信用代码一致"

      - field_name: 组织机构代码
        description: "组织机构代码，通常为统一社会信用代码中的第9至17位"

      - field_name: 注册地址
        description: "完整工商注册地址"

      - field_name: 经营范围
        description: "工商登记经营范围全文或摘要"

      - field_name: 所属行业
        description: "企业所属行业，如制造业/批发和零售业/软件和信息技术服务业等"

      - field_name: 曾用名
        description: "企业历史名称；没有则标记未找到"

      - field_name: 英文名
        description: "企业英文名称；没有则标记未找到"

      - field_name: 官网
        description: "企业官方网站URL；优先提取官网，其次提取权威来源中的网站字段"

      - field_name: 联系电话
        description: "公开披露的联系电话，可能来自年报、官网、招聘网站或商业数据库"

      - field_name: 电子邮箱
        description: "公开披露的企业邮箱，可能来自年报、官网、招聘网站或商业数据库"

      - field_name: 参保人数
        description: "社保参保人数或员工人数；优先使用年报参保人数"

      - field_name: 人员规模
        description: "招聘平台、官网或商业数据库披露的员工规模区间，如50-99人、100-499人"

      - field_name: 股东信息
        description: "股东/发起人名称、持股比例、认缴出资额、认缴日期等"

      - field_name: 主要人员
        description: "董事、监事、高级管理人员、经理等主要人员名单及职务"

      - field_name: 分支机构
        description: "企业下属分公司或分支机构名称、状态、地区等"

      - field_name: 对外投资
        description: "企业投资的其他企业名称、持股比例、投资金额、状态等"

      - field_name: 变更记录
        description: "工商变更事项、变更前内容、变更后内容、变更日期"

      - field_name: 经营异常
        description: "是否列入经营异常名录、列入原因、列入日期、移出日期等"

      - field_name: 行政处罚
        description: "行政处罚记录，包括处罚机关、处罚内容、处罚日期等"

      - field_name: 严重违法失信
        description: "是否存在严重违法失信记录及相关详情"

      - field_name: 来源名称
        description: "字段来源名称，如国家企业信用信息公示系统/天眼查/企查查/爱企查/启信宝/官网等"

      - field_name: 来源URL
        description: "字段对应的公开网页URL或搜索结果URL"

      - field_name: 来源类型
        description: "网页正文/搜索摘要/缓存页/商业数据库/政府公示/官网/招聘网站/新闻网页等"

    summary_prompt: |
      请从以下搜索结果中提取"{target}"的工商基本信息。结果中可能包含「结构化字段提取结果」表格（优先采信），以及各网页的正文和摘要。

      【数据提取规则】
      - 「结构化字段提取结果」表格中的数据已经过多源交叉验证，优先使用
      - 若表格中某字段为空（*未找到*），再从下方网页正文/摘要中查找补充
      - 搜索结果中"{target}"可能以查询主体、关联公司、新闻提及等形式出现，只要数据明确指向"{target}"即可提取
      - 职业卫生检测报告中的统一社会信用代码是检测机构自身的代码，切勿当作"{target}"的代码

      【信源权重与冲突处理】
      - 政府文件（gov.cn）> 商业数据库（企查查/天眼查/curtao）> 招聘平台/新闻 > 黄页/B2B
      - 多来源冲突时取高权重来源的值，并在摘要中注明冲突情况
      - 统一社会信用代码以18位、来源于政府/工商文件的为准

      【可信度判断标准】
      - 高：≥2个独立来源数据一致，且至少一个为政府或商业数据库
      - 中：1个来源有明确数据，或多来源一致但均为辅助来源（招聘/黄页/新闻）
      - 低：仅从侧面推断，或数据超过3年未更新
      - 待核实：各来源冲突且无法判断，或完全无数据

      【必须输出的字段】（逐个列出，无数据时写"未找到"，严禁省略）

      一、主体信息
      1. 企业名称（工商登记全称）
      2. 统一社会信用代码（18位）
      3. 法定代表人
      4. 注册资本（金额+币种）
      5. 实缴资本（金额+币种，无则写"未找到"）
      6. 成立日期（精确到年月日）
      7. 经营状态（存续/在业/注销/吊销等）
      8. 企业类型（有限责任公司/股份有限公司/合伙企业等）
      9. 营业期限（起止日期或"长期"）
      10. 登记机关
      11. 核准日期
      12. 工商注册号
      13. 纳税人识别号
      14. 组织机构代码

      二、联系与地址
      15. 注册地址（完整地址）
      16. 经营范围（摘要，100字内）
      17. 所属行业（国民经济行业分类）
      18. 曾用名（无则写"未找到"）
      19. 英文名（无则写"未找到"）
      20. 官网URL（无则写"未找到"）
      21. 联系电话（公开披露的，无则写"未找到"）
      22. 电子邮箱（公开披露的，无则写"未找到"）

      三、人员与规模
      23. 参保人数（社保参保人数，最精确）
      24. 人员规模区间（如50-99人、100-499人）
      25. 研发人员数量或占比（无则写"未找到"）

      四、股权与治理
      26. 股东/发起人信息（名称、持股比例、认缴出资额）
      27. 主要人员（董事、监事、高管等姓名及职务）
      28. 分支机构（名称、状态、地区）
      29. 对外投资（企业名称、持股比例、投资金额）

      五、历史与风险
      30. 变更记录（变更事项、变更前后内容、变更日期）
      31. 经营异常（列入原因、日期、移出日期）
      32. 行政处罚（处罚机关、内容、日期）
      33. 严重违法失信（有/无及相关详情）

      六、元信息
      34. 各字段来源名称（如：国家企业信用信息公示系统/天眼查/企查查/curtao/招聘平台等）
      35. 各字段来源URL

      【输出要求】
      - 按以上六类分节，每类下列出所有字段的值和可信度
      - 字段有值就如实输出，无任何线索才写"未找到"
      - 有冲突的字段注明各来源的值和最终采纳值

      搜索结果：
      {results}

  - id: industry
    name: 行业与细分
    order: 20
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 所属行业'
      - '"{target}" 经营范围'
      - '"{target}" 主营业务'
      - '"{target}" 主营产品'
    metaso_queries:
      - "{target}属于什么行业？国民经济行业分类是什么？主营业务和产品是什么？"
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的行业与细分信息。
      重点提取：所属行业（国民经济行业分类）、细分赛道、主营业务描述、经营范围摘要。
      企查查/天眼查的「行业」字段最权威；BOSS直聘的行业标签作为辅助；制造业目录(curtao)提供产品细分。

      搜索结果：
      {results}

  - id: scale
    name: 员工规模
    order: 30
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 参保人数'
      - '"{target}" 员工人数'
      - '"{target}" 员工规模'
      - '"{target}" 研发人员'
      - '"{target}" 工程师 技术人员 招聘'
    metaso_mode: search
    metaso_search_size: 1
    metaso_queries:
      - "{target}有多少员工？社保参保人数是多少？研发人员数量或占比是多少？"
      - "{target}的研发投入占营收比例是多少？研发工程师有多少人？"
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的员工规模信息，重点包括：
      1. 总员工人数（社保参保人数最精确，招聘平台规模区间作参考）
      2. 研发人员数量或占比（如有）
      信源说明：企查查「参保」数据为社保缴纳人数（最精确）；BOSS直聘/猎聘提供规模区间（如100-499人）。
      如多个来源数据不一致，全部列出并注明来源。
      若未找到研发人员相关信息，明确写「未找到研发人员数据」，不要省略该项。

      搜索结果：
      {results}

  - id: background
    name: 企业背景
    order: 40
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 官方网页'
    metaso_queries:
      - "{target} 企业性质 股东 实际控制人 股权结构"
      - "{target} 公司背景 注册资本 成立时间 行政处罚 失信记录"
    summary_prompt: |
      请从以下搜索结果中分析"{target}"的企业背景。
      重点提取：企业性质（民营/国有/外资/合资）、实际控制人、主要股东及持股比例、是否有行政处罚/失信记录。

      【提取规则】
      - 即使"{target}"在结果中仅被侧面提及，也应从中提取企业性质等可推断信息
      - 注册资本规模+成立年份等信息可辅助判断是否为民营小微企业
      - 未见行政处罚/失信记录时，明确写"未发现"而非"待核实"
      - 企查查与天眼查股东数据一致则标「高」；仅一方有数据标「中」；无股权结构但能推断企业性质标「低」

      【可信度判断】
      - 高：企业性质 + 实控人/股权结构来自≥2个权威来源且一致
      - 中：企业性质可从多个来源合理推断，或有单一来源的股权数据
      - 低：仅能推断企业性质，无股权/实控人数据
      - 待核实：连企业性质也无法判断

      搜索结果：
      {results}

  - id: tech_cert
    name: 科技属性资质
    order: 50
    enabled: true
    required: false
    minimax_queries:
      - '"{target}" 高新技术企业'
      - '"{target}" 专精特新'
      - '"{target}" 小巨人'
      - '"{target}" 隐形冠军'
      - '"{target}" 资质认证'
    metaso_queries:
      - "{target}是否是国家高新技术企业？证书编号是什么？认定年份是哪年？"
      - "{target}是否获得专精特新中小企业或专精特新小巨人认定？是否有双软认证或ISO认证？"
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的科技属性资质。
