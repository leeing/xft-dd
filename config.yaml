schema_version: "1.0"

target: ""
dimension_concurrency: 5
query_concurrency_per_dimension: 2
search_timeout_seconds: 60
max_results_per_query: 10
model: "MiniMax-M2.7-Highspeed"
output_language: "zh-CN"
runs_dir: "runs"

source_policy:
  authoritative_domains:
    - "gsxt.gov.cn"
    - "cnipa.gov.cn"
    - "sse.com.cn"
    - "szse.cn"
    - "innocom.gov.cn"
  commercial_sources:
    - "qcc.com"
    - "tianyancha.com"
    - "aiqicha.baidu.com"
    - "qyml.curtao.com"

report_options:
  include_sources: true
  include_checklist: true
  max_sources_per_dimension: 5

batch:
  company_concurrency: 1
  continue_on_company_error: true
  skip_existing: true
  batch_runs_dir: "batch_runs"

merge_prompt: |
  你是中国制造业顶级专家。以下是对"{target}"各维度的尽调摘要：

  {summaries}

  请综合以上信息，输出一份精简的企业尽调报告：
  1. 按维度分节，保留各维度的可信度标注
  2. 在报告末尾生成"人工核验清单"，列出所有"待核实"项及建议核验渠道
  3. 不得编造未出现在维度摘要中的事实
  4. 不相关数据不出现

dimensions:
  - id: basic_info
    name: 工商基本信息
    order: 10
    enabled: true
    required: true
    fetch_enabled: false
    search_queries:
      - '"{target}" 统一社会信用代码 法定代表人'
      - '"{target}" 注册资本 成立日期 经营状态'
      - '"{target}" 注册地址 经营范围'
      - '"{target}" 参保人数 员工人数'
      - '{target} 工商信息 启信宝'
      - '{target} 企业信息 企查查'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的工商基本信息。

      【数据提取规则】
      搜索结果中"{target}"可能以多种形式出现：
      - 作为查询主体（企查查/天眼查/启信宝的公司主页）→ 权威来源
      - 作为关联公司/相关企业被提及 → 次要来源，但字段值仍可使用
      - 在招聘信息、新闻、行业报告中被提及 → 辅助来源
      无论哪种形式出现，只要该字段数据明确指向"{target}"，都应提取并标注来源类型。

      【可信度判断标准】
      - 高：≥2个独立来源数据一致（含官方数据库或政府来源）
      - 中：1个来源有明确数据，或多个来源有相同数据（均为商业信息网站）
      - 低：仅从侧面/关联信息推断，或数据较旧（>3年）
      - 待核实：各来源数据互相冲突，或完全没有相关信息

      【提取字段】（有数据就填，无任何线索才写「待核实」）
      - 统一社会信用代码（18位字母数字组合）
      - 法定代表人姓名
      - 注册资本（金额+币种，如"1000万元人民币"）
      - 成立日期（精确到年月日或年份）
      - 经营状态（存续/注销/吊销等）
      - 企业类型（有限责任公司/股份公司等）
      - 注册地址（尽可能完整）
      - 经营范围（摘要，50字内）
      - 参保人数/员工人数（社保参保人数优先）

      搜索结果：
      {results}

  - id: industry
    name: 行业与细分
    order: 20
    enabled: true
    required: false
    search_queries:
      - '"{target}" 行业 经营范围 主营业务'
      - '"{target}" 所属行业 国民经济分类'
      - '"{target}" 主营产品 产品类目'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的行业与细分信息。
      重点提取：所属行业（国民经济行业分类）、细分赛道、主营业务描述、经营范围摘要。
      企查查/天眼查的「行业」字段最权威；BOSS直聘的行业标签作为辅助；制造业目录(curtao)提供产品细分。

      搜索结果：
      {results}

  - id: scale
    name: 员工规模
    order: 30
    enabled: true
    required: false
    search_queries:
      - '"{target}" 参保人数 员工'
      - '"{target}" 员工规模 人数 招聘'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的员工规模信息。
      信源说明：企查查「参保」数据为社保缴纳人数（最精确）；BOSS直聘/猎聘提供规模区间（如100-499人）。
      如多个来源数据不一致，全部列出并注明来源。

      搜索结果：
      {results}

  - id: background
    name: 企业背景
    order: 40
    enabled: true
    required: false
    search_queries:
      - '"{target}" 股东 持股比例 实际控制人'
      - '"{target}" 企业性质 民营 国有 外资'
      - '"{target}" 行政处罚 司法风险 失信'
      - '{target} 工商 天眼查'
    summary_prompt: |
      请从以下搜索结果中分析"{target}"的企业背景。
      重点提取：企业性质（民营/国有/外资/合资）、实际控制人、主要股东及持股比例、是否有行政处罚/失信记录。

      【提取规则】
      - 即使"{target}"在结果中仅被侧面提及，也应从中提取企业性质等可推断信息
      - 注册资本规模+成立年份等信息可辅助判断是否为民营小微企业
      - 未见行政处罚/失信记录时，明确写"未发现"而非"待核实"
      - 企查查与天眼查股东数据一致则标「高」；仅一方有数据标「中」；无股权结构数据标「低」

      搜索结果：
      {results}

  - id: tech_cert
    name: 科技属性资质
    order: 50
    enabled: true
    required: false
    search_queries:
      - '"{target}" 高新技术企业 证书编号'
      - '"{target}" 专精特新 小巨人'
      - '"{target}" 资质认证 ISO 双软'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的科技属性资质。
      重点提取：高新技术企业（证书编号+认定年份）、专精特新/小巨人、双软认证、ISO认证、其他行业资质。
      有证书编号或政府名单来源标「高」；仅商业库收录无编号标「中」。

      搜索结果：
      {results}

  - id: ip
    name: 知识产权
    order: 60
    enabled: true
    required: false
    search_queries:
      - '"{target}" 专利 商标 著作权'
      - '"{target}" 发明专利 实用新型 外观设计'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的知识产权信息。
      重点提取：专利总数（发明/实用新型/外观分类）、商标数量及主要商标名、软件著作权数量。
      企查查与爱企查数据一致标「高」，仅一方有数据标「中」。

      搜索结果：
      {results}

  - id: product
    name: 产品与定位
    order: 70
    enabled: true
    required: false
    search_queries:
      - '"{target}" 主营产品 核心竞争力'
      - '"{target}" 客户案例 合作品牌'
      - '"{target}" 产品目录 产品系列'
      - '{target} site:1688.com'
      - '{target} 佛山 家具五金 供应商'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的产品与市场定位信息。
      制造业采购平台(curtao.com, 1688.com)的产品目录最具参考价值；官网/展会信息作为补充。
      重点提取：核心产品线、技术特点/差异化、主要客户类型或合作品牌、市场定位（高中低端/To B/To C）。
      即使数据来自侧面提及或展会记录，也应提取产品关键词并说明数据来源。

      搜索结果：
      {results}

  - id: listing
    name: 上市情况
    order: 80
    enabled: true
    required: false
    search_queries:
      - '"{target}" 上市 股票代码 板块'
      - '"{target}" 拟上市 辅导备案 IPO'
    summary_prompt: |
      请从以下搜索结果中提取"{target}"的上市情况。
      重点提取：是否上市、股票代码、上市板块、是否有拟上市/辅导备案记录。

      【可信度判断标准】
      - 高：多个结果均未发现上市信息，且该公司仅作为第三方（如供应商）出现在他人IPO文件中
      - 中：有间接上市迹象但无直接证据
      - 待核实：结果中有明确的IPO/上市信息，需要人工核实

      注意：若"{target}"在他人的招股书中作为供应商/关联方出现，这不是该公司自身上市，应标注清楚并标「高」（未上市）。

      搜索结果：
      {results}
