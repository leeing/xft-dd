module_id: 差旅报销
module_name: 差旅报销
priority: 40
base_score: 40
acceptance_policy:
  levels:
  - result: 高
    min_matched_labels: 3
    conclusion: 命中3类及以上跨区域/客户现场出行场景，或售后现场+区域渠道+海外/项目交付组合明确。
  - result: 中高
    min_matched_labels: 2
    conclusion: 命中1-2类场景且证据明确指向客户现场、跨城市、区域渠道、驻场实施或海外拓展。普通销售/售后岗位只能作为待核实线索。
  - result: 低
    min_matched_labels: 0
    conclusion: 只有普通销售/售后岗位但无跨区域线索。
labels:
- label_id: 售后现场交付
  label_name: 售后现场交付
  description: 售后、安装、调试、维修工程师需要到客户现场。 痛点：差旅频繁、费用分散、项目归属难。 切入：售后差旅和客户现场服务切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 售后安装调试岗位
    indicator_name: 售后安装调试岗位
    evaluator: hybrid
    standard: 招聘标题包含售后、安装、调试、维修、技术支持、现场服务。 排除电话客服、本地门店售后。
    evidence_hints:
    - 售后
    - 安装
    - 调试
    - 维修
    - 技术支持
    - 现场服务
    prompt: '请判断企业是否满足指标：售后安装调试岗位。

      任务：判断售后岗位是否需要客户现场出差。

      matched：安装、调试、维修、现场服务、客户现场支持明确。

      possible：售后/技术支持但无现场或跨地证据。

      not_matched：仅电话客服或内勤支持。

      unknown：证据不足。

      禁止推断：不能把售后客服等同于差旅。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 售后
      - 安装
      - 调试
      - 维修
      - 技术支持
      - 现场服务
      min_matches: 1
    rule:
      source_field: __xlsx_table_only_rule__
      op: text_contains
      value:
      - 售后
      - 安装
      - 调试
      - 维修
      - 技术支持
      - 现场服务
    merge_policy: llm_confirm
- label_id: 项目制实施交付
  label_name: 项目制实施交付
  description: 实施、交付、项目经理跨地到场。 痛点：项目费用、差旅预算和审批难管。 切入：项目维度归集差旅费用切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 项目实施交付岗位
    indicator_name: 项目实施交付岗位
    evaluator: hybrid
    standard: 招聘出现实施工程师、项目经理、交付、驻场、现场实施。 需判断是否产生跨地出行。
    evidence_hints:
    - 实施
    - 交付
    - 项目经理
    - 驻场
    - 现场实施
    prompt: '请判断企业是否满足指标：项目实施交付岗位。

      标准：招聘出现实施工程师、项目经理、交付、驻场、现场实施。 需判断是否产生跨地出行。

      证据不足时返回 unknown 或 possible；不得用行业常识直接推断为 matched。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 实施
      - 交付
      - 项目经理
      - 驻场
      - 现场实施
      min_matches: 1
    rule:
      source_field: __xlsx_table_only_rule__
      op: text_contains
      value:
      - 实施
      - 交付
      - 项目经理
      - 驻场
      - 现场实施
    merge_policy: llm_confirm
- label_id: 渠道销售拓展
  label_name: 渠道销售拓展
  description: 区域销售、经销商维护、代理商开发。 痛点：跨区拜访、展会、渠道费用多。 切入：销售差旅和渠道费用切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 区域渠道销售岗位
    indicator_name: 区域渠道销售岗位
    evaluator: hybrid
    standard: 招聘出现区域销售、渠道、经销商、代理商、市场拓展。 区域、渠道、经销商、代理商、外贸或客户拜访为强线索；仅“销售”二字只能possible。
    evidence_hints:
    - 区域销售
    - 渠道
    - 经销商
    - 代理商
    - 市场拓展
    prompt: '请判断企业是否满足指标：区域渠道销售岗位。

      任务：判断销售是否跨区域维护渠道。

      matched：区域销售、渠道、经销商、代理商、出差拜访明确。

      possible：销售岗位存在但区域/渠道不明确。

      not_matched：纯内勤、电商运营或本地门店销售。

      unknown：证据不足。

      禁止推断：不能用销售二字直接判差旅。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 区域销售
      - 渠道
      - 经销商
      - 代理商
      - 市场拓展
      min_matches: 1
    rule:
      source_field: __xlsx_table_only_rule__
      op: text_contains
      value:
      - 区域销售
      - 渠道
      - 经销商
      - 代理商
      - 市场拓展
    merge_policy: llm_confirm
- label_id: 海外商务出行
  label_name: 海外商务出行
  description: 海外客户、展会、渠道、驻点或境外团队。 痛点：境外差旅标准、币种、票据和审批更复杂。 切入：境外差旅合规和费用标准切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 海外拓展出差信号
    indicator_name: 海外拓展出差信号
    evaluator: llm_web
    standard: 公开或招聘出现海外市场、境外出差、海外展会、外贸经理。 频次不可得，改为线索。
    evidence_hints:
    - 外贸
    - 海外
    - 国际业务
    - 国际销售
    - 外贸经理
    - 海外销售
    - 海外市场
    - 展会
    - 货物进出口
    - 技术进出口
    - 进出口业务
    - 自营和代理
    prompt: '请判断企业是否满足指标：海外拓展出差信号。

      标准：公开或招聘出现海外市场、境外出差、海外展会、外贸经理。 频次不可得，改为线索。

      证据不足时返回 unknown 或 possible；不得用行业常识直接推断为 matched。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 外贸
      - 海外
      - 国际业务
      - 国际销售
      - 外贸经理
      - 海外销售
      - 海外市场
      - 展会
      min_matches: 1
    - type: field
      op: contains_any
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: business_scope
      keywords:
      - 货物进出口
      - 技术进出口
      - 进出口业务
      - 自营和代理
      - 出口
      min_matches: 1
    web_search:
      when: rule_not_matched
      effect: llm_evidence
      fixed_queries:
      - '{company_name} 海外展会 境外出差'
      - '{company_name} 海外客户 渠道 拓展'
      auto:
        enabled: false
        max_queries: 0
        intent: 已有本地/规则线索不足时再补Web；不要在全量批次中扩展低命中泛查询。
      max_auto_rounds: 0
      max_results: 5
marketing_points:
  售后现场交付:
    recommendation: 企业存在“售后、安装、调试、维修工程师需要到客户现场。”场景，建议沟通差旅报销。
    sale_rule: 围绕“差旅频繁、费用分散、项目归属难。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 售后/安装/维修人员是否经常去客户现场，是否需要当天往返或跨城？
    - 现场服务产生的交通、住宿、配件垫付是否能关联到客户或工单？
    - 客户现场服务完成后，报销、服务单、回款资料是否需要一起留痕？
  项目制实施交付:
    recommendation: 企业存在“实施、交付、项目经理跨地到场。”场景，建议沟通差旅报销。
    sale_rule: 围绕“项目费用、差旅预算和审批难管。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 项目经理、实施、交付人员是否按项目申请差旅预算和报销？
    - 同一项目多人多次出差时，费用是否能按项目自动归集？
    - 项目超预算、跨部门审批、借款冲销目前哪个环节最慢？
  渠道销售拓展:
    recommendation: 企业存在“区域销售、经销商维护、代理商开发。”场景，建议沟通差旅报销。
    sale_rule: 围绕“跨区拜访、展会、渠道费用多。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 区域销售是否需要拜访经销商、代理商或终端客户？
    - 展会、客户拜访、渠道维护费用是否按区域或客户统计？
    - 销售差旅费用是否需要和CRM客户、商机或订单关联？
  海外商务出行:
    recommendation: 企业存在“海外客户、展会、渠道、驻点或境外团队。”场景，建议沟通差旅报销。
    sale_rule: 围绕“境外差旅标准、币种、票据和审批更复杂。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 是否有海外展会、客户拜访、驻点或跨境售后行程？
    - 境外差旅的币种、汇率、票据和审批标准现在怎么处理？
    - 出国申请、预算、报销、外汇或合规材料是否需要统一留痕？
