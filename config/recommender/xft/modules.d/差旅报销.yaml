marketing_points:
  售后属性:
    recommendation: ""
    sale_rule: ""
    kyc_questions:
      - 了解企业售后人员长期驻外或者长期出差，差旅报销单据是否很多，财务要经常审单。
      - 了解企业目前是否有使用报销系统，是否通过OA系统来管理，员工报销是否周期长？
      - 了解企业发票查验怎样管理，查重怎样管理。
      - 了解企业有没有私车公用管理情况，按照里程计算补贴
      - 了解企业是否有借支管理或者员工长期垫支情况
      - 了解企业是否有做项目成本管理，或者预算管理
  产销一体属性:
    recommendation: ""
    sale_rule: ""
    kyc_questions:
      - 了解企业既生产又销售，那么销售人员占比多少，占比高代表差旅报销量大。财务人员处理报销工作量是否大？
      - 了解企业销售人员是否经常驻点二、三线城市，差旅标准怎样管理
      - 了解企业是否存在员工虚报报销金额，虚开发票等情况
      - 了解企业有没有私车公用管理情况，按照里程计算补贴
      - 了解企业是否有借支管理或者员工长期垫支情况
  出口海外报销:
    recommendation: ""
    sale_rule: ""
    kyc_questions:
      - 了解企业员工是否需要海外出差，人数和频率如何？
      - 了解企业海外出差的差标是怎样设定，以美元来做核算单位？
      - 了解企业报销是否人民币结算，折算人民币怎样折算？
      - 海外没有发票，企业怎样核实员工消费真实性？
      - 海外消费高，了解员工出差是否要向企业借支？是否需要商务卡？
