module_id: 差旅报销
module_name: 差旅报销
priority: 50
base_score: 0
acceptance_policy:
  levels:
    - result: 高
      min_matched_labels: 3
      conclusion: 企业满足{attributes_number}个属性标签及{indicators_number}个指标，接受度为高。
    - result: 中高
      min_matched_labels: 2
      conclusion: 企业满足{attributes_number}个属性标签及{indicators_number}个指标，接受度为中高。
    - result: 低
      min_matched_labels: 0
      conclusion: 企业满足{attributes_number}个属性标签及{indicators_number}个指标，接受度为低。
labels:
  - label_id: 售后属性
    label_name: 售后属性
    description: ""
    min_matched_indicators: 1
    indicators:
      - indicator_id: 售后派驻属性
        indicator_name: 售后派驻属性
        evaluator: hybrid
        standard:
          1.招聘 JD 含 “售后派驻”“驻点维护”“外勤售后”“区域售后”“异地支援” 关键词≥2 次；2. 或 “派驻”“驻点”“外勤” 单独出现≥3
          次；3. 跨区域售后岗位≥3 个（不同省份 / 城市）
        rule:
          source_field: recent_recruitment_titles
          op: contains_any
          value:
            - 售后派驻
            - 驻点维护
            - 外勤售后
            - 区域售后
            - 异地支援
            - 派驻
            - 驻点
            - 外勤
        merge_policy: rule_first
        data_sources:
          - type: table
            table: recruitments
            field: title
            op: text_contains
            keywords:
              - 售后派驻
              - 驻点维护
              - 外勤售后
              - 区域售后
              - 异地支援
              - 派驻
              - 驻点
              - 外勤
        prompt: 请判断企业是否满足指标：售后派驻属性。只能基于证据判断，不得编造。
        evidence_hints:
          - 售后派驻属性
          - 招聘
          - JD
          - 售后派驻
          - 驻点维护
          - 外勤售后
          - 区域售后
          - 异地支援
        web_search:
          when: insufficient
          effect: llm_evidence
          fixed_queries:
            - "{company_name} 售后工程师"
          auto: false
      - indicator_id: 售后人员占比
        indicator_name: 售后人员占比
        evaluator: hybrid
        standard: 售后人员占企业人数的10%-30%，可按照招聘人员比例分析
        rule:
          source_field: recent_recruitment_titles
          op: contains_any
          value:
            - 售后
            - 客服
            - 技术支持
            - 售后工程师
        merge_policy: rule_first
        data_sources:
          - type: table
            table: recruitments
            field: title
            op: text_contains
            keywords:
              - 售后
              - 客服
              - 技术支持
              - 售后工程师
        prompt: 请判断企业是否满足指标：售后人员占比。只能基于证据判断，不得编造。
        evidence_hints:
          - 售后人员占比
          - 售后人员占企业人数的10
          - "30"
          - 可按照招聘人员比例分析
        web_search:
          when: insufficient
          effect: llm_evidence
          fixed_queries:
            - "{company_name} 售后"
          auto: false
      - indicator_id: 售后的_b_端商品的细分行业
        indicator_name: 售后的 B 端商品的细分行业
        evaluator: llm_web
        standard: 工业设备制造、商用装备、工业自动化、专用机械、通信基建
        data_sources: []
        prompt: 请判断企业是否满足指标：售后的 B 端商品的细分行业。只能基于证据判断，不得编造。
        evidence_hints:
          - 售后的
          - 端商品的细分行业
          - 工业设备制造
          - 商用装备
          - 工业自动化
          - 专用机械
          - 通信基建
        web_search:
          fixed_queries:
            - "{company_name} 售后 行业"
          auto: false
      - indicator_id: 技术含量
        indicator_name: 技术含量
        evaluator: hybrid
        standard:
          1. 发明专利≥3 项（核心技术专利，非外观 / 实用新型）；2. 持有设备类专项认证（工业产品生产许可证、设备安全认证）；3. 产品描述含
          “定制化”“系统集成” 关键词≥2 次
        rule:
          source_field: ip_counts.patent
          op: ">"
          value: 0
        merge_policy: rule_first
        data_sources:
          - type: table
            table: qualifications
            field: qualification_name
            op: exists
          - type: field
            path: ip_counts.patent
            op: ">"
            value: 0
        prompt: 请判断企业是否满足指标：技术含量。只能基于证据判断，不得编造。
        evidence_hints:
          - 技术含量
          - 发明专利
          - 核心技术专利
          - 非外观
          - 实用新型
          - 持有设备类专项认证
          - 工业产品生产许可证
          - 设备安全认证
        web_search:
          when: insufficient
          effect: llm_evidence
          fixed_queries:
            - "{company_name} 专利"
            - "{company_name} 认证"
          auto: false
      - indicator_id: 服务支持
        indicator_name: 服务支持
        evaluator: llm_web
        standard:
          1. 售后政策含 “安装调试”“质保≥1 年”“驻场服务” 关键词≥2 次；2. 招聘 “设备售后工程师”“技术支持专员” 岗位；3.
          故障响应承诺≤2 小时（公开服务条款）
        data_sources: []
        prompt: 请判断企业是否满足指标：服务支持。只能基于证据判断，不得编造。
        evidence_hints:
          - 服务支持
          - 售后政策含
          - 安装调试
          - 质保
          - 驻场服务
          - 关键词
          - 招聘
          - 设备售后工程师
        web_search:
          fixed_queries:
            - "{company_name} 售后"
            - "{company_name} 服务"
          auto: false
