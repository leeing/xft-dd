      - 排班
      - 夜班
      - 晚班
      - 日班
      - 两班
      - 三班
    data_sources: []
    prompt: 请判断企业是否满足指标：倒班制用工。只能基于证据判断，不得编造。
    evidence_hints:
    - 倒班制用工
    - 招聘
    - JD
    - 中倒班
    - 排班
