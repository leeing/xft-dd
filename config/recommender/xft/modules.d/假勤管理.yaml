module_id: 假勤管理
module_name: 假勤管理
priority: 42
base_score: 42
acceptance_policy:
  levels:
  - result: 高
    min_matched_labels: 3
    conclusion: 命中3个及以上核心痛点标签（不含科技数字化接受度），且至少包含倒班排班/多地点用工/合规追溯压力之一；制造业、科技资质不得单独支撑高接受度。
  - result: 中高
    min_matched_labels: 2
    conclusion: 命中2个核心痛点标签；或命中1个核心痛点标签并有明确多工种招聘、倒班、跨厂区或工时合规证据。仅“制造或生产型业务+科技数字化接受度”应降为低或待核实。
  - result: 低
    min_matched_labels: 0
    conclusion: 仅命中0-1个核心痛点标签，或只有制造业、科技资质、专利等泛线索。
labels:
- label_id: 多规则考勤
  label_name: 多规则考勤
  description: 生产、仓储、质检、研发、销售、行政等至少两类工作模式并存，且可能对应不同班次、地点或考勤规则。 痛点：多套规则、加班、请休假、计时计件或岗位工时口径难统一。 切入：不同岗位/班次规则切入。 角色：核心。
  min_matched_indicators: 2
  indicators:
  - indicator_id: 制造或生产型业务
    indicator_name: 制造或生产型业务
    evaluator: hybrid
    standard: 经营范围或行业显示制造、加工、生产、装配。 只作为多规则考勤的前置可能性，不得直接matched；必须结合多工种、倒班、地点或工时规则证据。
    evidence_hints:
    - 制造
    - 生产
    - 加工
    - 装配
    prompt: '请判断企业是否满足指标：制造或生产型业务。

      标准：经营范围或行业显示制造、加工、生产、装配。 只作为多规则考勤的前置可能性，不得直接matched；必须结合多工种、倒班、地点或工时规则证据。

      证据不足时返回 unknown 或 possible；不得用行业常识直接推断为 matched。'
    data_sources:
    - type: field
      op: contains_any
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: industry
      keywords:
      - 制造
      - 生产
      - 加工
      - 装配
    - type: field
      op: contains_any
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: business_scope
      keywords:
      - 制造
      - 生产
      - 加工
      - 装配
    rule:
      source_field: industry
      op: contains_any
      value:
      - 制造
      - 生产
      - 加工
      - 装配
    merge_policy: llm_confirm
  - indicator_id: 多工种招聘线索
    indicator_name: 多工种招聘线索
    evaluator: hybrid
    standard: 招聘标题覆盖生产、仓储、质检、研发、销售、行政中至少两类。 招聘标题需覆盖至少两类不同工作模式：生产/仓储/质检/研发/销售/行政/售后/外勤；单个泛岗位不得matched。
    evidence_hints:
    - 生产
    - 车间
    - 操作工
    - 普工
    - 仓库
    - 仓管
    - 质检
    - 品控
    - 研发
    - 工艺
    - 销售
    - 业务
    prompt: '请判断企业是否满足指标：多工种招聘线索。

      任务：根据岗位集合判断是否形成多套考勤规则。

      matched：至少两类明显不同工作模式，且能解释为不同班次、地点、工时或考勤口径；例如生产/仓储/质检/研发/销售/售后外勤组合。

      possible：只有制造/加工行业，或岗位类别不足两类，或工种差异存在但无法说明考勤规则差异。

      not_matched：岗位单一或只有管理岗。

      unknown：招聘样本不足或无法判断岗位类别。

      禁止推断：不能用制造业、科技资质或单个岗位推断全公司多规则考勤。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 生产
      - 车间
      - 操作工
      - 普工
      - 仓库
      - 仓管
      - 质检
      - 品控
      - 研发
      - 工艺
      - 销售
      - 业务
      - 行政
      - 售后
      - 维修
      min_matches: 2
    rule:
      source_field: __xlsx_table_only_rule__
      op: text_contains
      value:
      - 生产
      - 车间
      - 操作工
      - 普工
      - 仓库
      - 仓管
      - 质检
      - 品控
      - 研发
      - 工艺
      - 销售
      - 业务
      - 行政
      - 售后
      - 维修
    merge_policy: llm_confirm
- label_id: 倒班排班
  label_name: 倒班排班
  description: 车间存在白夜班、两班倒、轮班或频繁排班。 痛点：人工排班易错，打卡和班次无法自动关联。 切入：排班、班次、打卡联动切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 倒班排班岗位线索
    indicator_name: 倒班排班岗位线索
    evaluator: hybrid
    standard: 招聘或公开信息出现倒班、夜班、两班倒、排班、轮班。 普通制造业只能possible，不能直接matched。
    evidence_hints:
    - 倒班
    - 夜班
    - 两班倒
    - 排班
    - 轮班
    prompt: '请判断企业是否满足指标：倒班排班岗位线索。

      任务：判断倒班/排班是否是稳定生产场景。

      matched：明确夜班、两班倒、轮班、排班岗位。

      possible：只有生产岗位但无班次线索。

      not_matched：明确固定白班或办公室岗位为主。

      unknown：无招聘或公开班次信息。

      禁止推断：不能把普通制造业直接判为倒班。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 倒班
      - 夜班
      - 两班倒
      - 排班
      - 轮班
      min_matches: 1
    rule:
      source_field: __xlsx_table_only_rule__
      op: text_contains
      value:
      - 倒班
      - 夜班
      - 两班倒
      - 排班
      - 轮班
    merge_policy: rule_first
- label_id: 多地点用工
  label_name: 多地点用工
  description: 多厂区、分公司、外勤点位或跨城市人员。 痛点：考勤数据分散，集团无法统一看。 切入：多地点统一打卡和数据同步切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 分支或对外投资数量
    indicator_name: 分支或对外投资数量
    evaluator: rule
    standard: 分支机构或控股/投资主体达到阈值。 branch_count或outbound_investment_count满足阈值。
    evidence_hints:
    - 分支机构或控股
    - 投资主体达到阈值
    - branch
    - count或outbound
    - investment
    - count满足阈值
    data_sources:
    - type: field
      op: '>='
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: branch_count
      value: 3
    - type: field
      op: '>='
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: outbound_investment_count
      value: 3
    rule:
      source_field: branch_count
      op: '>='
      value: 3
  - indicator_id: 多厂区生产基地
    indicator_name: 多厂区生产基地
    evaluator: llm_web
    standard: 官网或新闻明确披露多个工厂/生产基地/园区。 需公开证据。
    evidence_hints:
    - '{company_name} 生产基地 工厂'
    - '{company_name} 多厂区 全国布局'
    - 已有本地/规则线索不足时再补Web；不要在全量批次中扩展低命中泛查询。
    prompt: '请判断企业是否满足指标：多厂区生产基地。

      标准：官网或新闻明确披露多个工厂/生产基地/园区。 需公开证据。

      证据不足时返回 unknown 或 possible；不得用行业常识直接推断为 matched。'
    web_search:
      when: rule_not_matched
      effect: llm_evidence
      fixed_queries:
      - '{company_name} 生产基地 工厂'
      - '{company_name} 多厂区 全国布局'
      auto:
        enabled: false
        max_queries: 0
        intent: 已有本地/规则线索不足时再补Web；不要在全量批次中扩展低命中泛查询。
      max_auto_rounds: 0
      max_results: 5
- label_id: 合规追溯压力
  label_name: 合规追溯压力
  description: 验厂、劳动争议、客户审核或用工合规要求。 痛点：考勤数据需真实、防篡改、可追溯。 切入：验厂材料、工时合规、劳动争议预防切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 验厂资质或客户审核
    indicator_name: 验厂资质或客户审核
    evaluator: llm_web
    standard: 公开资料出现BSCI、Sedex、SA8000、验厂、客户审核。 单纯出口不足以matched。
    evidence_hints:
    - '{company_name} BSCI Sedex SA8000 验厂'
    - '{company_name} 客户验厂 工时 合规'
    - 默认不自动扩查询；优先使用固定高意图查询，避免真实批量运行中单家公司触发过多低命中搜索。
    prompt: '请判断企业是否满足指标：验厂资质或客户审核。

      任务：判断是否存在验厂或用工合规追溯压力。

      matched：BSCI/Sedex/SA8000/验厂/客户审核/工时合规明确。

      possible：外贸或合规岗位但未说明验厂/工时。

      not_matched：仅出口或海外销售，无验厂合规证据。

      unknown：公开证据不足。

      禁止推断：单纯有出口或海外字样不足以matched。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    web_search:
      when: insufficient
      effect: llm_evidence
      fixed_queries:
      - '{company_name} BSCI Sedex SA8000 验厂'
      - '{company_name} 客户验厂 工时 合规'
      auto:
        enabled: false
        max_queries: 0
        intent: 默认不自动扩查询；优先使用固定高意图查询，避免真实批量运行中单家公司触发过多低命中搜索。
      max_auto_rounds: 0
      max_results: 5
  - indicator_id: 劳动争议与工时争议
    indicator_name: 劳动争议与工时争议
    evaluator: llm_web
    standard: 公开裁判文书/开庭公告/新闻显示劳动报酬、考勤、工时争议。 需劳动争议相关证据。
    evidence_hints:
    - '{company_name} 劳动争议 劳动报酬 考勤'
    - '{company_name} 裁判文书 开庭公告 工时'
    - 保留高意图自动扩查询，但建议批量运行时进入候选模块后再触发；若未实现候选阶段，max_auto_rounds应限制为1。
    prompt: '请判断企业是否满足指标：劳动争议与工时争议。

      任务：判断是否存在考勤、工时、劳动报酬相关争议。

      matched：权威资料明确劳动争议与考勤/工时/劳动报酬相关。

      possible：存在劳动争议但类型不清。

      not_matched：争议与用工考勤无关。

      unknown：无权威资料或无法确认关联。

      禁止推断：不能把普通法律风险推断成考勤痛点。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    web_search:
      when: always
      effect: llm_evidence
      fixed_queries:
      - '{company_name} 劳动争议 劳动报酬 考勤'
      - '{company_name} 裁判文书 开庭公告 工时'
      auto:
        enabled: true
        max_queries: 1
        intent: 保留高意图自动扩查询，但建议批量运行时进入候选模块后再触发；若未实现候选阶段，max_auto_rounds应限制为1。
      max_auto_rounds: 1
      max_results: 5
- label_id: 科技数字化接受度
  label_name: 科技数字化接受度
  description: 科技资质、知识产权、研发岗位只能说明企业更容易接受数字化系统，不直接说明假勤痛点。 痛点：这是接受度增强因素，不应单独进入高/中高推荐判断。 切入：仅在已命中用工复杂度标签时作为加分项引用。 角色：加分（不单独计入接受度）。
  min_matched_indicators: 2
  indicators:
  - indicator_id: 科技资质认证
    indicator_name: 科技资质认证
    evaluator: rule
    standard: 高新技术企业、专精特新、小巨人、科技型中小企业、企业技术中心等。 只说明数字化接受度和管理规范性；不单独支撑假勤高/中高接受度。仍需contains_any，不允许labels exists泛命中。
    evidence_hints:
    - 高新技术企业
    - 专精特新
    - 小巨人
    - 科技型中小企业
    - 企业技术中心
    - 隐形冠军
    - 单项冠军
    data_sources:
    - type: table
      op: contains_any
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: qualifications
      field: qualification_name
      limit: 50
      keywords:
      - 高新技术企业
      - 专精特新
      - 小巨人
      - 科技型中小企业
      - 企业技术中心
      - 隐形冠军
      - 单项冠军
      min_matches: 1
    - type: field
      op: contains_any
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: labels
      keywords:
      - 高新技术企业
      - 专精特新
      - 小巨人
      - 科技型中小企业
      - 企业技术中心
      - 隐形冠军
      - 单项冠军
      min_matches: 1
    rule:
      source_field: __xlsx_table_only_rule__
      op: contains_any
      value:
      - 高新技术企业
      - 专精特新
      - 小巨人
      - 科技型中小企业
      - 企业技术中心
      - 隐形冠军
      - 单项冠军
  - indicator_id: 知识产权数量门槛
    indicator_name: 知识产权数量门槛
    evaluator: hybrid
    standard: 专利>=3或软件著作权>=5；不以专利>0命中。 专利>=3或软件著作权>=5；只作为接受度加分，不说明考勤痛点。
    evidence_hints:
    - 专利
    - 3或软件著作权
    - 不以专利
    - 0命中
    - 只作为接受度加分
    - 不说明考勤痛点
    prompt: '请判断企业是否满足指标：知识产权数量门槛。

      标准：专利>=3或软件著作权>=5；不以专利>0命中。 专利>=3或软件著作权>=5；只作为接受度加分，不说明考勤痛点。

      证据不足时返回 unknown 或 possible；不得用行业常识直接推断为 matched。'
    data_sources:
    - type: field
      op: '>='
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: ip_counts.patent
      value: 3
    - type: field
      op: '>='
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: ip_counts.software
      value: 5
    rule:
      source_field: ip_counts.patent
      op: '>='
      value: 3
    merge_policy: rule_first
  - indicator_id: 研发岗位线索
    indicator_name: 研发岗位线索
    evaluator: hybrid
    standard: 招聘或公开资料有研发、工艺、实验、产品开发岗位。 不再判断研发人员占比。
    evidence_hints:
    - 研发
    - 工艺
    - 实验
    - 产品开发
    - 结构工程师
    - 产品工程师
    - 研发工程师
    - 工艺工程师
    - 实验员
    prompt: '请判断企业是否满足指标：研发岗位线索。

      任务：判断研发岗位是否说明数字化接受度和管理规范性。

      matched：研发/工艺/实验/产品开发岗位明确，且与生产或研发管理相关。

      possible：只有技术岗位泛线索。

      not_matched：无研发相关岗位。

      unknown：招聘不足。

      禁止推断：不能推断研发人员占比。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 研发
      - 工艺
      - 实验
      - 产品开发
      - 结构工程师
      - 产品工程师
      - 研发工程师
      - 工艺工程师
      - 实验员
      min_matches: 1
    rule:
      source_field: __xlsx_table_only_rule__
      op: text_contains
      value:
      - 研发
      - 工艺
      - 实验
      - 产品开发
      - 结构工程师
      - 产品工程师
      - 研发工程师
      - 工艺工程师
      - 实验员
    merge_policy: llm_confirm
marketing_points:
  多规则考勤:
    recommendation: 企业存在“生产、研发、仓储、销售、行政等多工种并存，考勤规则不一样。”场景，建议沟通假勤管理。
    sale_rule: 围绕“规则配置、加班、请休假、计时计件混合难管理。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 生产、仓储、研发、销售、行政是否分别使用不同考勤/加班/请假规则？
    - 车间工时、外勤打卡和办公室考勤现在是否在同一套系统里汇总？
    - 每月核算考勤异常、加班、补卡时，最容易出错的是哪类岗位？
  倒班排班:
    recommendation: 企业存在“车间存在白夜班、两班倒、轮班或频繁排班。”场景，建议沟通假勤管理。
    sale_rule: 围绕“人工排班易错，打卡和班次无法自动关联。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 是否有夜班、两班倒、轮班或临时调班，班次由谁维护？
    - 排班表和打卡记录是否能自动匹配，还是月底人工核对？
    - 调班、顶班、跨天班导致薪资或工时争议的频率高不高？
  多地点用工:
    recommendation: 企业存在“多厂区、分公司、外勤点位或跨城市人员。”场景，建议沟通假勤管理。
    sale_rule: 围绕“考勤数据分散，集团无法统一看。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 员工是否分布在多个厂区、分公司、仓库或客户现场？
    - 不同地点的打卡规则、WIFI/GPS/设备考勤是否统一管理？
    - 总部现在能否按地点快速查看缺勤、迟到、加班和人员出勤状态？
  合规追溯压力:
    recommendation: 企业存在“验厂、劳动争议、客户审核或用工合规要求。”场景，建议沟通假勤管理。
    sale_rule: 围绕“考勤数据需真实、防篡改、可追溯。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 客户验厂、工时审计或劳动争议时，是否需要导出原始考勤记录？
    - 考勤数据是否保留修改痕迹，谁改过、为什么改能否追溯？
    - 加班、调休、请假审批和实际打卡不一致时，目前怎么举证？
  科技数字化接受度:
    recommendation: 企业存在“科技资质、知识产权、研发生产复杂度说明更容易接受系统。”场景，建议沟通假勤管理。
    sale_rule: 围绕“该标签只说明接受度，不直接说明假勤痛点。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 研发、生产、质量等岗位是否已经在使用ERP、MES、OA或项目管理系统？
    - 管理层是否有把人事考勤数据和生产/项目数据打通的计划？
    - 若先从假勤模块切入，客户更关心效率、合规，还是和现有系统集成？
