- label_id: 出口海外
  label_name: 出口海外
  description: ''
  min_matched_indicators: 1
  indicators:
  - indicator_id: 海外代工
    indicator_name: 海外代工
    evaluator: llm_web
    standard: 1. 海外代工业务占比≥30%（代工收入 ÷ 总营收）；2. 合作客户含 1 家以上海外知名品牌（如沃尔玛、ZARA、亚马逊）
    data_sources: []
    prompt: 请判断企业是否满足指标：海外代工。只能基于证据判断，不得编造。
    evidence_hints:
    - 海外代工
    - 海外代工业务占比
    - '30'
    - 代工收入
    - 总营收
    - 合作客户含
    - 家以上海外知名品牌
    - 如沃尔玛
    web_search:
      fixed_queries:
      - '{company_name} 海外客户 代工'
      - '{company_name} OEM ODM 出口'
      - '{company_name} 沃尔玛 ZARA 亚马逊 供应商'
      auto: false
  - indicator_id: 海外营收
    indicator_name: 海外营收
    evaluator: llm_web
    standard: 1. 出口营收占比≥50%（海关出口额 ÷ 总营收）；2. 行业属性为纺织 / 电子 / 玩具 / 家具（高验厂需求行业）
    data_sources: []
    prompt: 请判断企业是否满足指标：海外营收。只能基于证据判断，不得编造。
    evidence_hints:
    - 海外营收
    - 出口营收占比
    - '50'
    - 海关出口额
    - 总营收
    - 行业属性为纺织
    - 电子
    - 玩具
    web_search:
      fixed_queries:
      - '{company_name} 出口营收 海外收入'
      - '{company_name} 海关 出口'
      - '{company_name} 年报 海外收入'
      auto: false
  - indicator_id: 境外设厂
    indicator_name: 境外设厂
    evaluator: hybrid
    standard: 在新闻招聘信息中体现海外有设立生产基地或者办公地点，或招聘 JD 提及境外国家、地区
    rule:
      source_field: recent_recruitment_titles
      op: contains_any
      value:
      - 海外
      - 境外
      - 驻外
      - 越南
      - 泰国
      - 印尼
      - 马来西亚
    merge_policy: rule_first
    data_sources: []
    prompt: 请判断企业是否满足指标：境外设厂。只能基于证据判断，不得编造。
    evidence_hints:
    - 境外设厂
    - 在新闻招聘信息中体现海外有设立生产基地或者办公地点
    - 或招聘
    - JD
    - 提及境外国家
    - 地区
    web_search:
      fixed_queries:
      - '{company_name} 海外工厂 生产基地'
      - '{company_name} 境外 办事处'
      - '{company_name} 越南 泰国 工厂'
      auto: false
  - indicator_id: 验厂相关资质_记录
    indicator_name: 验厂相关资质 / 记录
    evaluator: hybrid
    standard: 1. 已通过 BSCI/Sedex/SA8000 任一认证（有效期内）； 近 2 年验厂次数≥1 次（含客户验厂 / 第三方审核）
    rule:
      source_field: labels
      op: contains_any
      value:
      - BSCI
      - Sedex
      - SA8000
      - 验厂
      - 社会责任
    merge_policy: rule_first
    data_sources: []
    prompt: 请判断企业是否满足指标：验厂相关资质 / 记录。只能基于证据判断，不得编造。
    evidence_hints:
    - 验厂相关资质
    - 记录
    - 已通过
    - BSCI
    - Sedex
    - SA8000
    - 任一认证
    - 有效期内
    web_search:
      fixed_queries:
      - '{company_name} BSCI Sedex SA8000'
      - '{company_name} 验厂 认证'
      auto: false
  - indicator_id: 考勤岗位设置
    indicator_name: 考勤岗位设置
    evaluator: rule
    standard: 招聘 JD 提及 “合规专员”、“验厂专员” 关键词≥1 次
    rule:
      source_field: recent_recruitment_titles
      op: contains_any
      value:
      - 合规专员
      - 验厂专员
      - 考勤
      - 薪酬
      - 人事专员
    data_sources: []
    prompt: 请判断企业是否满足指标：考勤岗位设置。只能基于证据判断，不得编造。
    evidence_hints:
    - 考勤岗位设置
    - 招聘
    - JD
    - 提及
    - 合规专员
    - 验厂专员
    - 关键词
  - indicator_id: 外贸岗位设置
    indicator_name: 外贸岗位设置
    evaluator: rule
    standard: 招聘 JD 提及 “派驻海外”、“外贸“、”外语“ 关键词≥1 次
    rule:
      source_field: recent_recruitment_titles
      op: contains_any
      value:
      - 外贸
      - 外语
      - 英语
      - 海外销售
      - 国际业务
      - 出口业务
    data_sources: []
    prompt: 请判断企业是否满足指标：外贸岗位设置。只能基于证据判断，不得编造。
    evidence_hints:
    - 外贸岗位设置
    - 招聘
    - JD
    - 提及
    - 派驻海外
    - 外贸
    - 外语
    - 关键词
  - indicator_id: 境外工作地点
    indicator_name: 境外工作地点
    evaluator: hybrid
    standard: 招聘信息中体现有海外地址
    rule:
      source_field: recent_recruitment_titles
      op: contains_any
      value:
      - 海外
      - 境外
      - 驻外
      - 越南
      - 泰国
      - 印尼
      - 马来西亚
    merge_policy: rule_first
    data_sources: []
    prompt: 请判断企业是否满足指标：境外工作地点。只能基于证据判断，不得编造。
    evidence_hints:
    - 境外工作地点
    - 招聘信息中体现有海外地址
    web_search:
      fixed_queries:
      - '{company_name} 海外招聘 驻外'
      - '{company_name} 境外 工作地点'
      auto: false
  - indicator_id: 商品服务有出口特征
    indicator_name: 商品服务有出口特征
    evaluator: llm_web
    standard: 出口导向型业务
    data_sources: []
    prompt: 请判断企业是否满足指标：商品服务有出口特征。只能基于证据判断，不得编造。
    evidence_hints:
    - 商品服务有出口特征
    - 出口导向型业务
    web_search:
      fixed_queries:
      - '{company_name} 出口 外贸 产品'
      - '{company_name} 海外市场 产品'
      - '{company_name} 海关 出口 产品'
      auto: false
marketing_points:
  科技属性:
    recommendation: ''
    sale_rule: ''
    kyc_questions:
    - 了解企业目前有没有上考勤系统，平时怎样统计考勤？
    - 了解企业是否存在不同岗位人员不同考勤规则的情况？有没有固定上班和排班？
    - 了解员工是否有加班，加班是给加班费，还是转调休假，如果是调休假目前手工统计管理还是通过系统处理？
    - 了解企业算工资是不是计时和月薪的，要不要通过考勤来核算。
  制造业通用考勤:
    recommendation: ''
    sale_rule: ''
    kyc_questions:
    - 了解企业目前有没有上考勤系统，平时怎样统计考勤？
    - 了解企业是否存在不同岗位人员不同考勤规则的情况？有没有固定上班和排班？
    - 了解员工是否有加班，加班是给加班费，还是转调休假，如果是调休假目前手工统计管理还是通过系统处理？
    - 了解企业算工资是不是计时和月薪的，要不要通过考勤来核算。
  多分支机构:
    recommendation: ''
    sale_rule: ''
    kyc_questions:
    - 存在分支机构的企业，了解考勤是统一管理还是各自独立管理，集团要不要看分子公司考勤？
    - 了解企业是否每个分子公司一张独立的考勤统计报表，统计项不一样
  倒班排班:
