module_id: 假勤管理
module_name: 假勤管理
priority: 50
base_score: 0
acceptance_policy:
  levels:
  - result: 高
    min_matched_labels: 3
    conclusion: 企业满足{attributes_number}个属性标签及{indicators_number}个指标，接受度为高。
  - result: 中高
    min_matched_labels: 2
    conclusion: 企业满足{attributes_number}个属性标签及{indicators_number}个指标，接受度为中高。
  - result: 低
    min_matched_labels: 0
    conclusion: 企业满足{attributes_number}个属性标签及{indicators_number}个指标，接受度为低。
labels:
- label_id: 科技属性
  label_name: 科技属性
  description: ''
  min_matched_indicators: 1
  indicators:
  - indicator_id: 研发人员占比
    indicator_name: 研发人员占比
    evaluator: rule
    standard: 有明确研发岗位招聘或本地画像中的研发岗位线索；不再按无法核实的研发人员占比直接命中
    rule:
      source_field: recent_recruitment_titles
      op: contains_any
      value:
      - 研发
      - 技术研发
      - 产品开发
      - 研发工程师
      - 工艺工程师
    data_sources: []
    prompt: 请判断企业是否存在明确研发岗位线索。只能基于证据判断，不得编造。
    evidence_hints:
    - 研发人员占比
    - '20'
    - 研发岗员工数
    - 总员工数
  - indicator_id: 研发费用占比
    indicator_name: 研发费用占比
    evaluator: llm_web
    standard: 公开年报、招股书或官方新闻明确披露研发投入、研发费用或研发项目；不再依据泛网页推断比例
    data_sources: []
    prompt: 请判断企业是否满足指标：研发费用占比。只能基于证据判断，不得编造。
    evidence_hints:
    - 研发费用占比
    - 营收
    - '5000'
    - 按数字化转型型标准
    web_search:
      fixed_queries:
      - '{company_name} 研发投入 研发费用'
      - '{company_name} 年报 研发费用'
      - '{company_name} 招股书 研发费用'
      auto: false
  - indicator_id: 细分行业
    indicator_name: 细分行业
    evaluator: llm
    standard: 电子信息、生物医药、新材料制造、新能源装备、工业机器人、工业母机、汽车零部件、医疗设备、集成电路、半导体、电子元件、通讯设备、高端装备、航天航空设备制造、精密仪器、传感器、电池、精密制造等科技行业
    data_sources: []
    prompt: 请判断企业是否满足指标：细分行业。只能基于证据判断，不得编造。
    evidence_hints:
    - 细分行业
    - 电子信息
    - 生物医药
    - 新材料制造
    - 新能源装备
    - 工业机器人
    - 工业母机
    - 汽车零部件
    web_search:
      when: insufficient
      effect: llm_evidence
      fixed_queries:
      - '{company_name} 官网 主营业务'
      - '{company_name} 科技 制造 产品'
      auto:
        enabled: true
        max_queries: 2
        intent: 查企业公开主营业务、产品、行业属性，辅助判断是否属于科技制造细分行业
  - indicator_id: 科技企业_科技资质认证
    indicator_name: 科技企业-科技资质认证
    evaluator: rule
    standard: 高新技术企业证书、双软认证、专精特新、小巨人、隐形冠军、单项冠军、科技型中小企业
    data_sources:
    - type: table
      table: qualifications
      field: qualification_name
      op: exists
    - type: field
      path: labels
      op: exists
    prompt: 请判断企业是否满足指标：科技企业-科技资质认证。只能基于证据判断，不得编造。
    evidence_hints:
    - 科技企业
    - 科技资质认证
    - 高新技术企业证书
    - 双软认证
    - 专精特新
    - 小巨人
    - 隐形冠军
    - 单项冠军
    web_search:
      when: rule_not_matched
      effect: possible_on_evidence
      fixed_queries:
      - '{company_name} 高新技术企业 专精特新'
      - '{company_name} 科技型中小企业 资质'
  - indicator_id: 知识产权数量多
    indicator_name: 知识产权数量多
    evaluator: rule
    standard: 发明专利≥3 项 或 软件著作权≥5 项
    data_sources:
    - type: field
      path: ip_counts.patent
      op: '>'
      value: 0
    prompt: 请判断企业是否满足指标：知识产权数量多。只能基于证据判断，不得编造。
    evidence_hints:
    - 知识产权数量多
    - 发明专利
    - 软件著作权
- label_id: 制造业通用考勤
  label_name: 制造业通用考勤
  description: ''
  min_matched_indicators: 1
  indicators:
  - indicator_id: 行业
    indicator_name: 行业
    evaluator: rule
    standard: 制造业
    rule:
      source_field: industry
      op: contains
      value: 制造
    data_sources: []
    prompt: 请判断企业是否满足指标：行业。只能基于证据判断，不得编造。
    evidence_hints:
    - 行业
    - 制造业
  - indicator_id: 考勤管理需求
    indicator_name: 考勤管理需求
    evaluator: rule
    standard: 招聘 JD 提及 “考勤打卡”“工时统计”、考勤管理、数据统计、 关键词≥1 次
    data_sources:
    - type: table
      table: recruitments
      field: title
      op: text_contains
      keywords:
      - 考勤
      - 工时
      - 人事
      - 行政
      - 薪酬
      - 生产跟单
    prompt: 请判断企业是否满足指标：考勤管理需求。只能基于证据判断，不得编造。
    evidence_hints:
    - 考勤管理需求
    - 招聘
    - JD
    - 提及
    - 考勤打卡
    - 工时统计
    - 考勤管理
    - 数据统计
  - indicator_id: 劳动争议记录
    indicator_name: 劳动争议记录
    evaluator: llm
    standard: 近 2 年（自查询日起）考勤 / 劳动报酬相关争议≥1 起（已结案 / 正在审理）
    data_sources: []
    prompt: 请判断企业是否满足指标：劳动争议记录。只能基于证据判断，不得编造。
    evidence_hints:
    - 劳动争议记录
    - 自查询日起
    - 考勤
    - 劳动报酬相关争议
    - 已结案
    - 正在审理
  - indicator_id: 多类型工种
    indicator_name: 多类型工种
    evaluator: rule
    standard: 招聘岗位中，存在超过2种生产类、研发类、行政类、物流类、销售类 、售后类岗位
    data_sources:
    - type: table
      table: recruitments
      field: title
      op: text_contains
      keywords:
      - 生产
      - 技术
      - 研发
      - 质量
      - 检验
      - 仓库
      - 物流
      - 销售
      - 售后
      min_matches: 2
    prompt: 请判断企业是否满足指标：多类型工种。只能基于证据判断，不得编造。
    evidence_hints:
    - 多类型工种
    - 招聘岗位中
    - 存在超过2种生产类
    - 研发类
    - 行政类
    - 物流类
    - 销售类
    - 售后类岗位
- label_id: 多分支机构
  label_name: 多分支机构
  description: ''
  min_matched_indicators: 1
  indicators:
  - indicator_id: 分支机构数量
    indicator_name: 分支机构数量
    evaluator: rule
    standard: ≥3 个（需有独立办公场所 / 工商注册的分公司 / 办事处）
    rule:
      source_field: branch_count
      op: '>='
      value: 3
    data_sources: []
    prompt: 请判断企业是否满足指标：分支机构数量。只能基于证据判断，不得编造。
    evidence_hints:
    - 分支机构数量
    - 需有独立办公场所
    - 工商注册的分公司
    - 办事处
  - indicator_id: 多厂区布局
    indicator_name: 多厂区布局
    evaluator: llm_web
    standard: ≥2 个省级生产基地（需具备独立生产资质 + 工商注册 / 租赁备案）
    data_sources:
    - type: table
      table: branches
      field: branch_name
      op: exists
    prompt: 请判断企业是否满足指标：多厂区布局。只能基于证据判断，不得编造。
    evidence_hints:
    - 多厂区布局
    - 个省级生产基地
    - 需具备独立生产资质
    - 工商注册
    - 租赁备案
    web_search:
      fixed_queries:
      - '{company_name} 生产基地 工厂'
      - '{company_name} 多厂区 生产基地'
      - '{company_name} 联系我们 工厂 地址'
      auto: false
  - indicator_id: 跨区域经营
    indicator_name: 跨区域经营
    evaluator: hybrid
    standard: 分支机构≥3 个（分公司 / 办事处，含生产 / 经营职能）
    rule:
      source_field: branch_count
      op: '>='
      value: 3
    merge_policy: rule_first
    data_sources: []
    prompt: 请判断企业是否满足指标：跨区域经营。只能基于证据判断，不得编造。
    evidence_hints:
    - 跨区域经营
    - 分支机构
    - 分公司
    - 办事处
    - 含生产
    - 经营职能
    web_search:
      fixed_queries:
      - '{company_name} 分公司 办事处'
      - '{company_name} 销售网点 生产基地'
      auto: false
- label_id: 倒班排班
