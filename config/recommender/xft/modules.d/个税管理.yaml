module_id: 个税管理
module_name: 个税管理
priority: 42
base_score: 42
acceptance_policy:
  levels:
  - result: 高
    min_matched_labels: 3
    conclusion: 命中3个及以上薪税复杂度标签。
  - result: 中高
    min_matched_labels: 2
    conclusion: 命中2个薪税复杂度标签。
  - result: 低
    min_matched_labels: 0
    conclusion: 仅规模或行业泛线索。
labels:
- label_id: 多地人员组织
  label_name: 多地人员组织
  description: 员工分布在多个城市或长期异地招聘。 痛点：个税属地、社保个税协同和人员归属复杂。 切入：多地薪税申报和人员归属切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 分支机构跨城
    indicator_name: 分支机构跨城
    evaluator: hybrid
    standard: 分支机构、招聘城市或官网布局显示多城市人员。 结构化优先，官网补充。
    evidence_hints:
    - '{company_name} 全国布局 分公司 招聘'
    - '{company_name} 多地招聘 生产基地'
    - 默认不自动扩查询；优先使用固定高意图查询，避免真实批量运行中单家公司触发过多低命中搜索。
    prompt: '请判断企业是否满足指标：分支机构跨城。

      任务：判断是否影响个税属地和薪税管理。

      matched：多地员工/招聘/分支/基地明确。

      possible：只有分支但人员属性不明。

      not_matched：单地经营。

      unknown：证据不足。

      禁止推断：不能把对外投资直接等同于员工多地申报。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    data_sources:
    - type: field
      op: '>='
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: branch_count
      value: 2
    rule:
      source_field: branch_count
      op: '>='
      value: 2
    merge_policy: llm_confirm
    web_search:
      when: rule_not_matched
      effect: possible_on_evidence
      fixed_queries:
      - '{company_name} 全国布局 分公司 招聘'
      - '{company_name} 多地招聘 生产基地'
      auto:
        enabled: false
        max_queries: 0
        intent: 默认不自动扩查询；优先使用固定高意图查询，避免真实批量运行中单家公司触发过多低命中搜索。
      max_auto_rounds: 0
      max_results: 5
- label_id: 多法人集团
  label_name: 多法人集团
  description: 集团、控股、多子公司、多对外投资。 痛点：多主体薪酬、个税、报表口径统一难。 切入：集团薪税集中管控切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 集团控股结构
    indicator_name: 集团控股结构
    evaluator: rule
    standard: 名称含集团/控股，或对外投资/子公司数量达到阈值。 共享多主体口径。
    evidence_hints:
    - 集团
    - 控股
    data_sources:
    - type: field
      op: contains_any
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: company_name
      keywords:
      - 集团
      - 控股
      min_matches: 1
    - type: field
      op: '>='
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: outbound_investment_count
      value: 3
    rule:
      source_field: company_name
      op: contains_any
      value:
      - 集团
      - 控股
- label_id: 治理合规强化
  label_name: 治理合规强化
  description: 上市、拟上市、国资、外资等治理要求高。 痛点：薪税合规、内控留痕和审计要求更强。 切入：薪税合规和内控切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 股票代码上市身份
    indicator_name: 股票代码上市身份
    evaluator: rule
    standard: company_profile.stock_code存在。 法定信披不参与判定。
    evidence_hints:
    - company
    - profile
    - stock
    - code存在
    - 法定信披不参与判定
    data_sources:
    - type: field
      op: exists
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: stock_code
      min_matches: 1
    rule:
      source_field: stock_code
      op: exists
  - indicator_id: 国资外资身份
    indicator_name: 国资外资身份
    evaluator: hybrid
    standard: 企业类型、股东或标签显示国资、国有控股、外资、港澳台投资。 字段不足再Web。
    evidence_hints:
    - 国有
    - 国资
    - 外资
    - 港澳台
    - 中外合资
    prompt: '请判断企业是否满足指标：国资外资身份。

      任务：判断身份是否带来薪税合规/治理复杂度。

      matched：国资/外资/港澳台投资身份明确，且有治理或薪酬合规合理关联。

      possible：身份线索存在但与薪税复杂度关联弱。

      not_matched：无身份或身份不相关。

      unknown：证据不足。

      禁止推断：身份不能独立承担全部推荐理由。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    data_sources:
    - type: field
      op: contains_any
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      path: company_org_type
      keywords:
      - 国有
      - 国资
      - 外资
      - 港澳台
      - 中外合资
      min_matches: 1
    rule:
      source_field: company_org_type
      op: contains_any
      value:
      - 国有
      - 国资
      - 外资
      - 港澳台
      - 中外合资
    merge_policy: llm_confirm
  - indicator_id: IPO拟上市动态
    indicator_name: IPO拟上市动态
    evaluator: llm_web
    standard: 公开资料显示上市辅导、招股书、提交申报、问询反馈。 动态类才Web。
    evidence_hints:
    - '{company_name} 上市辅导 招股书'
    - '{company_name} IPO 申报 问询'
    - 保留高意图自动扩查询，但建议批量运行时进入候选模块后再触发；若未实现候选阶段，max_auto_rounds应限制为1。
    prompt: '请判断企业是否满足指标：IPO拟上市动态。

      任务：判断拟上市动态是否增强薪税合规要求。

      matched：上市辅导、招股书、申报、问询反馈明确。

      possible：融资/资本市场泛新闻。

      not_matched：无拟上市证据。

      unknown：证据不足。

      禁止推断：法定信披不参与独立判定。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    web_search:
      when: always
      effect: llm_evidence
      fixed_queries:
      - '{company_name} 上市辅导 招股书'
      - '{company_name} IPO 申报 问询'
      auto:
        enabled: true
        max_queries: 1
        intent: 保留高意图自动扩查询，但建议批量运行时进入候选模块后再触发；若未实现候选阶段，max_auto_rounds应限制为1。
      max_auto_rounds: 1
      max_results: 5
- label_id: 派驻与灵活用工
  label_name: 派驻与灵活用工
  description: 外派、驻场、兼职、劳务或灵活用工。 痛点：用工关系和个税处理复杂。 切入：复杂用工薪税合规切入。 角色：辅助。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 复杂用工岗位线索
    indicator_name: 复杂用工岗位线索
    evaluator: hybrid
    standard: 招聘出现外派、驻场、劳务、兼职、灵活用工、薪酬社保。 需判断是否影响个税管理。
    evidence_hints:
    - '{company_name} 外派 驻场 灵活用工'
    - '{company_name} 劳务 派遣 薪酬 社保'
    - 默认不自动扩查询；优先使用固定高意图查询，避免真实批量运行中单家公司触发过多低命中搜索。
    prompt: '请判断企业是否满足指标：复杂用工岗位线索。

      标准：招聘出现外派、驻场、劳务、兼职、灵活用工、薪酬社保。 需判断是否影响个税管理。

      证据不足时返回 unknown 或 possible；不得用行业常识直接推断为 matched。'
    rule:
      source_field: __xlsx_no_local_rule__
      op: exists
    merge_policy: rule_first
    web_search:
      when: insufficient
      effect: llm_evidence
      fixed_queries:
      - '{company_name} 外派 驻场 灵活用工'
      - '{company_name} 劳务 派遣 薪酬 社保'
      auto:
        enabled: false
        max_queries: 0
        intent: 默认不自动扩查询；优先使用固定高意图查询，避免真实批量运行中单家公司触发过多低命中搜索。
      max_auto_rounds: 0
      max_results: 5
marketing_points:
  多地人员组织:
    recommendation: 企业存在“员工分布在多个城市或长期异地招聘。”场景，建议沟通个税管理。
    sale_rule: 围绕“个税属地、社保个税协同和人员归属复杂。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 员工是否在多个城市工作或缴纳社保个税，申报地如何确定？
    - 跨城市调岗、外派、异地招聘后，薪税和社保资料如何同步？
    - 不同地区政策、基数、专项附加扣除资料由谁负责核对？
  多法人集团:
    recommendation: 企业存在“集团、控股、多子公司、多对外投资。”场景，建议沟通个税管理。
    sale_rule: 围绕“多主体薪酬、个税、报表口径统一难。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 集团内是否存在多个法人主体共同用工或人员借调？
    - 员工薪酬、个税申报、成本归属是否需要跨主体拆分？
    - 多主体报表、个税数据和银行发薪数据是否能统一校验？
  治理合规强化:
    recommendation: 企业存在“上市、拟上市、国资、外资等治理要求高。”场景，建议沟通个税管理。
    sale_rule: 围绕“薪税合规、内控留痕和审计要求更强。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 上市、拟上市、国资或外资背景下，薪税数据是否需要审计留痕？
    - 高管、股权激励、奖金递延或专项扣除资料是否有专门复核？
    - 税务检查或审计时，历史薪酬个税资料能否快速追溯导出？
  派驻与灵活用工:
    recommendation: 企业存在“外派、驻场、兼职、劳务或灵活用工。”场景，建议沟通个税管理。
    sale_rule: 围绕“用工关系和个税处理复杂。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 是否有驻场、外派、兼职、劳务派遣或灵活用工人员？
    - 这些人员的报酬、个税、社保、公积金由谁申报和复核？
    - 用工关系变化后，合同、考勤、薪酬和个税是否能同步更新？
