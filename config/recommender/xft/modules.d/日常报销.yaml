module_id: 日常报销
module_name: 日常报销
priority: 40
base_score: 40
acceptance_policy:
  levels:
  - result: 高
    min_matched_labels: 3
    conclusion: 命中3个及以上高频费用场景。
  - result: 中高
    min_matched_labels: 2
    conclusion: 命中2个高频费用场景。
  - result: 低
    min_matched_labels: 0
    conclusion: 仅有单一弱线索。
labels:
- label_id: 日常外勤垫付
  label_name: 日常外勤垫付
  description: 外勤、销售、售后、市场人员频繁发生小额费用。 痛点：票据散、垫付多、报销周期长。 切入：移动报销和票据采集切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 外勤岗位线索
    indicator_name: 外勤岗位线索
    evaluator: hybrid
    standard: 招聘出现外勤、销售、市场、售后、巡店、驻点等。 与差旅区分：不要求跨省/长途。
    evidence_hints:
    - 外勤
    - 销售
    - 市场
    - 售后
    - 巡店
    - 驻点
    prompt: '请判断企业是否满足指标：外勤岗位线索。

      任务：判断是否有高频小额报销场景。

      matched：外勤、巡店、销售/售后跑动频繁，可能产生交通、餐补、物料费用。

      possible：存在外勤岗位但频率不清。

      not_matched：内勤为主。

      unknown：证据不足。

      禁止推断：不要把跨城市差旅和日常外勤混为一谈。

      只能基于结构化证据、招聘证据或权威公开证据判断，不得编造。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 外勤
      - 销售
      - 市场
      - 售后
      - 巡店
      - 驻点
      min_matches: 1
    rule:
      source_field: __xlsx_table_only_rule__
      op: text_contains
      value:
      - 外勤
      - 销售
      - 市场
      - 售后
      - 巡店
      - 驻点
    merge_policy: llm_confirm
- label_id: 门店网点运营
  label_name: 门店网点运营
  description: 多门店、多网点或区域运营人员。 痛点：门店费用分散，总部难统一归集。 切入：门店费用标准和集中管理切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 门店网点线索
    indicator_name: 门店网点线索
    evaluator: llm_web
    standard: 公开资料或招聘显示门店、直营网点、区域运营、巡店。 门店网点需公开证据。
    evidence_hints:
    - '{company_name} 门店 网点 区域运营'
    - '{company_name} 巡店 直营网点'
    - 默认不自动扩查询；优先使用固定高意图查询，避免真实批量运行中单家公司触发过多低命中搜索。
    prompt: '请判断企业是否满足指标：门店网点线索。

      标准：公开资料或招聘显示门店、直营网点、区域运营、巡店。 门店网点需公开证据。

      证据不足时返回 unknown 或 possible；不得用行业常识直接推断为 matched。'
    web_search:
      when: insufficient
      effect: llm_evidence
      fixed_queries:
      - '{company_name} 门店 网点 区域运营'
      - '{company_name} 巡店 直营网点'
      auto:
        enabled: false
        max_queries: 0
        intent: 默认不自动扩查询；优先使用固定高意图查询，避免真实批量运行中单家公司触发过多低命中搜索。
      max_auto_rounds: 0
      max_results: 5
- label_id: 研发试制费用
  label_name: 研发试制费用
  description: 研发打样、试制、实验耗材、小额采购频繁。 痛点：小额采购和临时报销频繁。 切入：研发试制费用和小额采购切入。 角色：核心。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 研发试制线索
    indicator_name: 研发试制线索
    evaluator: hybrid
    standard: 存在研发、实验、打样、试制、样品、工艺岗位或科技资质。 科技资质不是充分条件，需结合研发试制场景。
    evidence_hints:
    - 研发
    - 实验
    - 打样
    - 试制
    - 样品
    - 工艺
    prompt: '请判断企业是否满足指标：研发试制线索。

      标准：存在研发、实验、打样、试制、样品、工艺岗位或科技资质。 科技资质不是充分条件，需结合研发试制场景。

      证据不足时返回 unknown 或 possible；不得用行业常识直接推断为 matched。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 研发
      - 实验
      - 打样
      - 试制
      - 样品
      - 工艺
      min_matches: 1
    rule:
      source_field: __xlsx_table_only_rule__
      op: text_contains
      value:
      - 研发
      - 实验
      - 打样
      - 试制
      - 样品
      - 工艺
    merge_policy: llm_confirm
- label_id: 行政办公分散
  label_name: 行政办公分散
  description: 办公用品、福利、团建、培训等日常费用分散。 痛点：审批口径不统一，预算不可视。 切入：预算、标准和审批流切入。 角色：辅助。
  min_matched_indicators: 1
  indicators:
  - indicator_id: 行政采购岗位线索
    indicator_name: 行政采购岗位线索
    evaluator: hybrid
    standard: 招聘出现行政、采购、办公用品、后勤、费用报销。 辅助指标。
    evidence_hints:
    - 行政
    - 采购
    - 办公用品
    - 后勤
    - 费用报销
    prompt: '请判断企业是否满足指标：行政采购岗位线索。

      标准：招聘出现行政、采购、办公用品、后勤、费用报销。 辅助指标。

      证据不足时返回 unknown 或 possible；不得用行业常识直接推断为 matched。'
    data_sources:
    - type: table
      op: text_contains
      description: 来自 xlabel_v2.xlsx 本地证据规则。
      table: recruitments
      field: title
      limit: 50
      keywords:
      - 行政
      - 采购
      - 办公用品
      - 后勤
      - 费用报销
      min_matches: 1
    rule:
      source_field: __xlsx_table_only_rule__
      op: text_contains
      value:
      - 行政
      - 采购
      - 办公用品
      - 后勤
      - 费用报销
    merge_policy: llm_confirm
marketing_points:
  日常外勤垫付:
    recommendation: 企业存在“外勤、销售、售后、市场人员频繁发生小额费用。”场景，建议沟通日常报销。
    sale_rule: 围绕“票据散、垫付多、报销周期长。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 销售、售后、市场人员是否经常垫付交通、快递、样品或招待费用？
    - 小额费用是随手拍票、月末集中贴票，还是由助理代报？
    - 报销周期长导致员工催款或票据遗失的情况是否常见？
  门店网点运营:
    recommendation: 企业存在“多门店、多网点或区域运营人员。”场景，建议沟通日常报销。
    sale_rule: 围绕“门店费用分散，总部难统一归集。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 门店/网点是否有日常水电、物料、维修、促销等零星费用？
    - 总部如何控制不同门店的费用标准、预算和审批权限？
    - 门店票据是否容易丢失、重复报销或无法及时归集？
  研发试制费用:
    recommendation: 企业存在“研发打样、试制、实验耗材、小额采购频繁。”场景，建议沟通日常报销。
    sale_rule: 围绕“小额采购和临时报销频繁。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 研发打样、试制、测试时是否会临时采购小工具、耗材或配件？
    - 这些费用是否需要关联研发项目、样机、试验批次或费用化/资本化口径？
    - 研发费用归集、发票验真和加计扣除资料准备目前是否费时？
  行政办公分散:
    recommendation: 企业存在“办公用品、福利、团建、培训等日常费用分散。”场景，建议沟通日常报销。
    sale_rule: 围绕“审批口径不统一，预算不可视。”确认当前人工处理方式、系统覆盖和管理成本。
    kyc_questions:
    - 办公用品、快递、印刷、保洁、维修等费用是否由多个部门分散采购？
    - 行政费用是否有统一预算和供应商，还是各部门先垫付再报？
    - 哪些行政费用最容易出现票据不合规、重复报销或审批绕行？
