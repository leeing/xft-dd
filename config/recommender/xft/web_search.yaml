version: "1.1"
enabled: true
cache_root: data/web
default_providers:
  - minimax_search

providers:
  metaso_search:
    type: metaso
    enabled: true
    mode: search
    search_size: 3
    timeout_seconds: 30

  metaso_chat:
    type: metaso
    enabled: false
    mode: chat
    search_size: 3
    timeout_seconds: 45

  minimax_search:
    type: minimax
    enabled: true
    max_results: 5
    timeout_seconds: 30

execution:
  max_results_per_query: 5

fetch:
  enabled: true
  timeout_seconds: 25
  concurrency: 2
  max_chars: 6900
  blocked_domains: []
