version: "1.0"
scenario: product_recommendation
output_dir: recommendation_runs
products:
  - module_id: procurement_srm
    module_name: 供应商关系管理(SRM)
    priority: 90
    base_score: 50
    target_needs:
      - supply_chain_procurement
      - business_product
    match_rule: 制造业、采购链条较长、招投标或资质较多、员工规模较大的企业，优先考虑供应商准入、采购协同和供应商绩效管理。
    positive_rules:
      - id: procurement_dimension_supported
        dimension_id: supply_chain_procurement
        evidence_type: supported
        weight: 18
        reason: 供应链与采购维度已有本地或推断证据支持。
      - id: bidding_signal
        source_field: bidding_total
        op: ">"
        value: 0
        weight: 10
        reason: 存在招投标记录，可能具备供应商或项目采购协同场景。
    negative_rules:
      - id: missing_supplier_count
        missing_evidence: 供应商数量
        penalty: 5
        reason: 缺少供应商数量，影响采购复杂度判断。

  - module_id: finance_erp
    module_name: 财务管理(ERP)
    priority: 86
    base_score: 48
    target_needs:
      - finance_tax
      - basic_profile
      - digitalization
    match_rule: 多组织、员工规模较大、上市或股权结构较复杂的企业，优先考虑财务核算、合并报表、预算和业财一体化。
    positive_rules:
      - id: finance_dimension_supported
        dimension_id: finance_tax
        evidence_type: supported
        weight: 16
        reason: 财税与经营维度已有证据支持。
      - id: listed_company_signal
        source_field: is_listed
        op: "=="
        value: true
        weight: 10
        reason: 上市公司通常具备更高的财务规范化与报表协同需求。
    negative_rules:
      - id: missing_finance_system
        missing_evidence: 财务系统使用情况
        penalty: 5
        reason: 缺少现有财务系统信息，影响替换或集成判断。

  - module_id: crm_channel
    module_name: 客户与渠道管理(CRM)
    priority: 82
    base_score: 46
    target_needs:
      - sales_channel
      - business_product
      - overseas_business
    match_rule: 存在销售团队、跨区域市场、经销渠道、跨境或多客户触达线索的企业，优先考虑客户管理和渠道协同。
    positive_rules:
      - id: sales_channel_supported
        dimension_id: sales_channel
        evidence_type: supported
        weight: 16
        reason: 销售与渠道维度已有证据支持。
      - id: business_product_supported
        dimension_id: business_product
        evidence_type: supported
        weight: 8
        reason: 产品或业务信息较明确，可进一步识别客户触达场景。

  - module_id: hr_attendance
    module_name: 人力资源与考勤管理
    priority: 80
    base_score: 45
    target_needs:
      - hr_workforce
      - digitalization
    match_rule: 员工规模较大、招聘活跃、制造或多组织企业，优先考虑组织人事、考勤排班、薪酬绩效和用工合规。
    positive_rules:
      - id: workforce_dimension_supported
        dimension_id: hr_workforce
        evidence_type: supported
        weight: 18
        reason: 人力与用工维度已有证据支持。
      - id: employee_scale_signal
        source_field: employee_count
        op: ">="
        value: 200
        weight: 10
        reason: 员工规模较大，通常存在考勤排班、组织人事与薪酬绩效管理需求。
    negative_rules:
      - id: missing_shift_policy
        missing_evidence: 倒班制度
        penalty: 5
        reason: 缺少倒班制度信息，影响考勤排班方案判断。

  - module_id: ip_management
    module_name: 知识产权与研发资产管理
    priority: 76
    base_score: 42
    target_needs:
      - tech_innovation
      - business_product
    match_rule: 专利、商标、软著或科技资质较丰富的企业，优先考虑知识产权台账、研发项目和资质维护。
    positive_rules:
      - id: tech_dimension_supported
        dimension_id: tech_innovation
        evidence_type: supported
        weight: 18
        reason: 科技创新或知识产权维度已有证据支持。
      - id: ip_count_signal
        source_field: intellectual_count
        op: ">"
        value: 0
        weight: 10
        reason: 存在知识产权线索，具备研发资产管理切入点。

  - module_id: risk_compliance
    module_name: 风控合规管理
    priority: 74
    base_score: 42
    target_needs:
      - compliance_risk
      - basic_profile
    match_rule: 上市公司、风险记录较多、资质/招投标/合规要求较高的企业，优先考虑风险监测、合规流程和证照管理。
    positive_rules:
      - id: compliance_dimension_supported
        dimension_id: compliance_risk
        evidence_type: supported
        weight: 18
        reason: 合规与风险维度已有证据支持。
      - id: risk_count_signal
        source_field: risk_total
        op: ">"
        value: 0
        weight: 10
        reason: 存在风险记录，适合风险监测与合规流程切入。
    negative_rules:
      - id: unresolved_conflict_penalty
        relation_to_profile: conflict
        penalty: 8
        reason: 存在 Web 与本地画像冲突，需先核实再推进。

  - module_id: bidding_management
    module_name: 招投标管理
    priority: 70
    base_score: 40
    target_needs:
      - supply_chain_procurement
      - sales_channel
      - compliance_risk
    match_rule: 有招投标记录或政府/大客户项目线索的企业，优先考虑标讯跟踪、投标流程、项目资料和合同归档。
    positive_rules:
      - id: bidding_total_signal
        source_field: bidding_total
        op: ">"
        value: 0
        weight: 18
        reason: 存在招投标记录，具备标讯跟踪和投标资料管理场景。
      - id: procurement_supported
        dimension_id: supply_chain_procurement
        evidence_type: supported
        weight: 8
        reason: 采购或供应链维度支持招投标管理切入。

  - module_id: data_analytics
    module_name: 数据分析与经营驾驶舱
    priority: 68
    base_score: 40
    target_needs:
      - digitalization
      - finance_tax
      - sales_channel
    match_rule: 规模较大、多组织、多业务线或经营信息复杂的企业，优先考虑经营指标、财务销售采购数据整合和管理驾驶舱。
    positive_rules:
      - id: digitalization_supported
        dimension_id: digitalization
        evidence_type: supported
        weight: 16
        reason: 数字化或系统建设维度已有证据支持。
      - id: employee_scale_dashboard
        source_field: employee_count
        op: ">="
        value: 500
        weight: 8
        reason: 企业规模较大，可能存在经营指标汇总与驾驶舱需求。
