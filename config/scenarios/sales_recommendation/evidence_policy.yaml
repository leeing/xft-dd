version: "1.0"

# Evidence policy for this scenario. Business users can tune these values
# without changing Python code.

web_planning:
  supported_facts_to_skip_web: 3

dimension_analysis:
  supported_facts_threshold: 3

resolver:
  source_priority:
    local_json: 0
    manual: 1
    rule: 2
    web: 3
    llm_extraction: 4

  authority_boost:
    high:
      低: 中
      中: 高
      待补充: 中
      待核实: 中
    medium:
      低: 中
      待补充: 低
      待核实: 低

  quality_score:
    primary: 15
    confirmation: 10
    supplement: 5
    inference: 3
    conflict_penalty: 10
    min_score: 0
    max_score: 100

recommender:
  max_web_evidence_per_dimension: 5
  supported_quality_threshold: 45
  partial_quality_threshold: 15
  high_confidence_quality_threshold: 60
  medium_confidence_quality_threshold: 30
  low_confidence_quality_threshold: 10
