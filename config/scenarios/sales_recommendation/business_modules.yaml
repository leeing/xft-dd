      high_frequency_invoicing:
        recommendation: |
          高频开票企业容易出现客户开票信息维护、批量开票、红冲、作废和对账压力。
        sale_rule: |
          企业命中高频开票属性，可从销项发票批量开具、客户抬头维护和开票对账切入。
        kyc_questions:
