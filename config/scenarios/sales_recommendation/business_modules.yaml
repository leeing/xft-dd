            evidence_hints:
              - ERP
              - 业财一体化
              - 财务系统
              - 数字化
              - 开票系统
          - indicator_id: system_recruitment
            indicator_name: 招聘与团队配置
            evaluator: llm
            standard: 存在IT、信息化、财务系统、ERP实施、数据管理等岗位线索。
            evidence_hints:
              - IT
              - 信息化
              - ERP实施
              - 数据管理
