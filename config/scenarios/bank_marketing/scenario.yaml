version: "1.0"
extends: ../sales_recommendation
id: bank_marketing
name: 银行业营销场景
description: 面向银行客户经理的企业软件营销推荐场景，示例展示如何只用 patch 调整产品规则。

output_dir: ../../../recommendation_runs/bank_marketing
web_cache_root: ../../../data/web/bank_marketing

patches:
  products:
    - module_id: corporate_payment
      set:
        base_score: 55
        match_rule: 银行高质量客户、对公付款或跨境结算活跃的企业，优先考虑对公报账、付款审批和结算协同。
      append_positive_rules:
        - id: bank_high_quality_customer
          source_field: bank_flags.high_quality_customer
          op: "=="
          value: true
          weight: 12
          reason: 银行高质量客户标签提示金融服务匹配度更高。
        - id: cross_border_settlement_signal
          dimension_id: overseas_business
          evidence_type: supported
          weight: 8
          reason: 跨境业务线索提示对公付款、结算协同和附件归档需求。
