[project]
name = "xft"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "httpx>=0.28.1",
    "pycookiecheat>=0.8.0",
    "keyring>=25.7.0",
    "crawl4ai>=0.7.6",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "structlog",
    "types-pyyaml>=6.0.12.20260508",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diligence"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "T20",
    "PLR", "PLW", "TRY", "G",
    "ARG", "C4", "C90", "EM", "FBT", "DTZ", "PERF", "ISC", "SLOT",
]
unfixable = ["S307", "S609", "S301", "S302", "S105", "S106", "S107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "ARG001", "S324", "S603", "PLW1510", "FBT001", "FBT002", "N802", "SIM117", "I001"]
"src/diligence/utils/minimax_search.py" = ["S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = [
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
