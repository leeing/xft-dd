services:
  xft:
    build: .
    image: xft:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./recommendation_runs:/app/recommendation_runs
      - ./runs:/app/runs
      - ./batch_runs:/app/batch_runs
      # Uncomment to override the built-in config:
      # - ./config:/app/config:ro
